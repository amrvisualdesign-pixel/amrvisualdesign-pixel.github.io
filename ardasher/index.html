:root{--ink:#1F2430;--mut:#5B6170;--cream:#FBF5EA;--sky:#F3E3C8;--sun:#F2A33A;--deep:#24304A;--s:'Lora',Georgia,serif;--b:'Mulish',system-ui,sans-serif;--e:cubic-bezier(.23,1,.32,1);--pad:28px}
body{background:var(--cream);color:var(--ink);font:400 18px/1.65 var(--b)}
::selection{background:var(--sun);color:var(--ink)}
:focus-visible{outline:2px solid var(--deep);outline-offset:3px}
.w{max-width:1160px;margin:0 auto;padding:0 var(--pad)}
header{position:fixed;inset:0 0 auto;z-index:40;transition:background .3s var(--e)}
header.solid{background:var(--cream);box-shadow:0 1px 0 rgba(31,36,48,.1)}
.hb{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font:600 24px var(--s);text-decoration:none}
.logo i{font-style:italic;color:#B5651D}
.r{display:flex;align-items:center;gap:6px}
.lang button{background:none;border:0;cursor:pointer;font:700 13px var(--b);padding:10px 7px;min-height:44px;color:var(--mut)}
.lang button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--sun)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:999px;background:var(--ink);color:var(--cream);font:700 15px var(--b);text-decoration:none;border:0;cursor:pointer;transition:transform .16s var(--e),background .2s}
.btn:hover{background:#343B4C}.btn:active{transform:scale(.97)}
.btn.sun{background:var(--sun);color:var(--ink)}.btn.sun:hover{background:#F7B358}

.hero{padding:120px 0 70px}
.hg{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,5vw,70px);align-items:center}
.hero h1{font:500 clamp(46px,6.4vw,92px)/1 var(--s);letter-spacing:-.02em}
.hero h1 em{font-style:italic;color:#B5651D}
.hero p{color:var(--mut);margin-top:22px;max-width:46ch}
.hero .acts{display:flex;gap:14px;margin-top:28px;align-items:center;flex-wrap:wrap}
.hero .from{font:600 16px var(--b)}.hero .from b{font:600 26px var(--s)}
.hero .ph{aspect-ratio:4/5;border-radius:220px 220px 18px 18px}
.hero .ph .fb{font:500 28px var(--s);color:rgba(31,36,48,.25);background:#EAD9BC}
/* day */
.day{height:520vh;position:relative}
.day .st{position:sticky;top:0;height:100svh;overflow:hidden;background:var(--skyc,#F6E1BE);transition:background-color .2s linear}
.arc{position:absolute;left:50%;bottom:-12vh;width:min(140vw,1500px);aspect-ratio:2/1;transform:translateX(-50%);pointer-events:none}
.arc path{fill:none;stroke:rgba(31,36,48,.18);stroke-width:1.5;stroke-dasharray:4 8}
.sunb{position:absolute;width:clamp(70px,9vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE3A3,var(--sunc,#F2A33A));box-shadow:0 0 90px 20px rgba(242,163,58,.35);transform:translate(-50%,-50%);will-change:left,top}
.ridge{position:absolute;left:0;right:0;bottom:0;height:34vh;fill:var(--ridge,#3B4A55);transition:fill .2s linear}
.ridge2{opacity:.55}
.clock{position:absolute;top:96px;left:0;right:0}
.clock .t{font:500 clamp(64px,11vw,150px)/1 var(--s);font-variant-numeric:tabular-nums;color:var(--clk,var(--ink));letter-spacing:-.02em;transition:color .3s}
.slot{position:relative;margin-top:18px;max-width:520px;min-height:180px}
.slot article{position:absolute;inset:0 auto auto 0;opacity:0;transform:translateY(14px);transition:opacity .5s var(--e),transform .5s var(--e)}
.slot article.on{opacity:1;transform:none}
.slot h3{font:600 clamp(26px,3vw,38px)/1.1 var(--s);color:var(--clk,var(--ink))}
.slot p{margin-top:10px;color:var(--clp,var(--mut));max-width:44ch}
.ticks{position:absolute;right:var(--pad);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px}
.ticks span{display:block;width:26px;height:2px;background:var(--clk,var(--ink));opacity:.25;transition:opacity .3s,width .4s var(--e)}
.ticks span.on{opacity:1;width:44px}
/* walks */
.walks{padding:clamp(90px,13vh,150px) 0}
.walks h2,.qa h2,.ask h2{font:500 clamp(36px,4.6vw,64px)/1.05 var(--s);letter-spacing:-.015em}
.wl{margin-top:44px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px}

.walk .ph .fb{font:500 24px var(--s);color:rgba(31,36,48,.25);background:#EEDFC6}
.walk .in{padding:24px 26px 26px;display:flex;flex-direction:column;flex:1}
.walk h3{font:600 28px/1.1 var(--s)}
.walk p{color:var(--mut);margin-top:10px;flex:1}
.walk .row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.walk .pr{font:600 22px var(--s)}
.walk a{font-weight:700;color:var(--ink);min-height:44px;display:inline-flex;align-items:center}
.side{display:grid;gap:20px}
.side .walk .ph{aspect-ratio:16/8}
/* qa */
.qa{padding:0 0 clamp(90px,13vh,150px)}
.qg{display:grid;grid-template-columns:1fr 1.6fr;gap:clamp(30px,6vw,90px)}
.q{border-top:1px solid rgba(31,36,48,.14)}.q:last-child{border-bottom:1px solid rgba(31,36,48,.14)}
.q button{width:100%;display:flex;justify-content:space-between;gap:18px;align-items:center;background:none;border:0;text-align:left;padding:22px 0;min-height:44px;cursor:pointer;font:600 21px/1.3 var(--s);color:var(--ink)}
.q i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sky);position:relative;transition:background .3s,transform .4s var(--e)}
.q i::before,.q i::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;background:var(--ink);transform:translate(-50%,-50%)}
.q i::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .3s var(--e)}
.q button[aria-expanded="true"] i{background:var(--sun);transform:rotate(180deg)}
.q button[aria-expanded="true"] i::after{transform:translate(-50%,-50%) rotate(0)}
.q p{padding:0 0 22px;color:var(--mut);max-width:60ch}

.ag{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(30px,5vw,70px);position:relative}

.ask .ch a{color:#F2EDE3}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
[data-field]{display:flex;flex-direction:column;gap:6px}
[data-field].full{grid-column:1/-1}
label{font:700 13px var(--b);color:#B9C1D3}
input,select,textarea{font:400 17px var(--b);background:#2E3B57;border:1px solid #3E4D6C;color:#F2EDE3;padding:13px 16px;min-height:50px;width:100%;border-radius:14px}
input::placeholder,textarea::placeholder{color:#97A1B8}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sun)}
textarea{min-height:100px;resize:vertical}
.err{color:#FFB4A6;font-size:13px}
.fine{grid-column:1/-1;font-size:13px;color:#97A1B8}
.ready{grid-column:1/-1;font-weight:700}.ready a{color:var(--sun)}
footer{background:var(--deep);color:#97A1B8;border-top:1px solid #34425F;padding:24px 0 110px;font-size:13.5px}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:#B9C1D3}
@media (max-width:900px){.hg,.wl,.qg,.ag{grid-template-columns:1fr}.hero .ph{aspect-ratio:4/3;border-radius:180px 180px 18px 18px}}

/* shared plumbing: languages, photos, WhatsApp form, header state. The design lives in each page. */
document.documentElement.classList.add("js");
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var lang = "en";
function setLang(l){
  lang = T[l] ? l : "en"; var d = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=d[el.dataset.t]; if(v!=null) el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(function(el){var v=d[el.dataset.th]; if(v!=null) el.innerHTML=v;});
  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=d[el.dataset.ph]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.lang===lang?"true":"false");});
  document.querySelectorAll(".ph .fb").forEach(function(f){var s=f.parentElement.dataset.label; if(s&&d[s]) f.textContent=d[s];});
  if(window.onLang) onLang(d);
  document.title = d.title;
  try{localStorage.setItem(SLUG+"-lang",lang);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang);});});

/* accordion helper for each page's own question markup */
function qa(box, items, cls){
  var open=[].map.call(box.querySelectorAll("button[aria-expanded]"),function(b){return b.getAttribute("aria-expanded")==="true";});
  box.innerHTML="";
  items.forEach(function(q,i){
    var id=box.id+"-a"+i, o=!!open[i];
    var wrap=document.createElement("div"); wrap.className=cls||"q";
    wrap.innerHTML='<button type="button" aria-expanded="'+o+'" aria-controls="'+id+'"><span class="qt"></span><i aria-hidden="true"></i></button><div class="qa-a" id="'+id+'"><div><p></p></div></div>';
    wrap.querySelector(".qt").textContent=q[0]; wrap.querySelector("p").textContent=q[1];
    wrap.querySelector("button").addEventListener("click",function(){this.setAttribute("aria-expanded",this.getAttribute("aria-expanded")==="true"?"false":"true");});
    box.appendChild(wrap);
  });
}

/* photographs from Wikimedia Commons; a named placeholder stays if none loads */
var used=[];
function credit(n){if(used.indexOf(n)>-1)return; used.push(n); var cl=document.getElementById("cl"); if(!cl)return; var a=document.createElement("a"); a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(n); a.target="_blank"; a.rel="noopener"; a.textContent=used.length; if(cl.childNodes.length)cl.appendChild(document.createTextNode(" ")); cl.appendChild(a); var c=document.getElementById("credits"); if(c)c.hidden=false;}
function loadPhoto(el, list){
  list = (list || el.dataset.photo || "").split("|").filter(Boolean);
  el.querySelectorAll("img,.fb").forEach(function(x){x.remove();});
  if(getComputedStyle(el).position==="static") el.style.position="relative";
  var fb=document.createElement("span"); fb.className="fb"; var s=el.dataset.label; if(s&&T[lang][s]) fb.textContent=T[lang][s]; el.appendChild(fb);
  var img=new Image(); img.alt=""; img.decoding="async"; if(!el.dataset.eager) img.loading="lazy";
  var w=el.dataset.w||1000;
  img.onload=function(){if(img.naturalWidth>50){img.classList.add("ok"); fb.remove(); credit(img.dataset.n);}};
  img.onerror=function(){var n=list.shift(); if(n){img.dataset.n=n; img.src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(n)+"?width="+w;} else img.remove();};
  el.appendChild(img); img.onerror();
}

/* WhatsApp form: every field with data-m becomes a line of the message */
function wireForm(){
  document.querySelectorAll("[data-wa]").forEach(function(a){a.href="https://wa.me/"+PHONE;});
  document.querySelectorAll("[data-tg]").forEach(function(a){a.href="https://t.me/"+TG;});
  var f=document.getElementById("form"); if(!f) return;
  f.addEventListener("submit",function(e){
    e.preventDefault(); var d=T[lang], n=document.getElementById("n"), box=n.closest("[data-field]");
    if(!n.value.trim()){box.classList.add("bad"); n.focus(); return;} box.classList.remove("bad");
    var lines=[d.hello];
    f.querySelectorAll("[data-m]").forEach(function(x){var v=x.tagName==="SELECT"?x.options[x.selectedIndex].textContent:x.value.trim(); if(v) lines.push((d[x.dataset.m]||"")+": "+v);});
    var a=document.getElementById("wa"); a.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(lines.join("\n"));
    document.getElementById("ready").classList.add("show"); a.focus();
  });
  document.querySelectorAll("[data-pick]").forEach(function(a){a.addEventListener("click",function(){var s=document.getElementById("r"); if(s) s.value=a.dataset.pick;});});
}

/* header turns solid after the first screen; the phone bar shows between hero and form */
function wireChrome(){
  var hd=document.querySelector("header"), hero=document.querySelector("[data-hero]"), mbar=document.querySelector(".mbar"), form=document.getElementById("form");
  var tick=false;
  function f(){tick=false; var hb=hero?hero.getBoundingClientRect().bottom:0;
    if(hd) hd.classList.toggle("solid", hb<80);
    if(mbar&&form){var r=form.getBoundingClientRect(); mbar.classList.toggle("on", hb<0 && !(r.top<innerHeight&&r.bottom>0));}
    if(window.onScroll) onScroll();}
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(f);}},{passive:true});
  addEventListener("resize",f); f();
}
function progress(el){var r=el.getBoundingClientRect(); return Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight)));}
function reveal(sel){var els=document.querySelectorAll(sel); if(RM||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"}); els.forEach(function(e){io.observe(e);});}

function boot(){
  var l=null; try{l=localStorage.getItem(SLUG+"-lang");}catch(e){}
  if(!l){var n=(navigator.language||"en").toLowerCase(); l=n.indexOf("ru")===0?"ru":n.indexOf("tg")===0?"tg":"en";}
  setLang(l);
  document.querySelectorAll(".ph[data-photo]").forEach(function(el){loadPhoto(el);});
  wireForm(); wireChrome();
}

/* the day: sun on an arc, sky colour from dawn to dusk */
var dayEl=document.getElementById("day"), st=dayEl.querySelector(".st"), sun=document.getElementById("sun"), arcp=document.getElementById("arcp"), arcSvg=dayEl.querySelector(".arc"), slot=document.getElementById("slot"), ticks=document.getElementById("ticks"), clk=document.getElementById("clk");
var L=arcp.getTotalLength(), cur=-1;
var SKY=[[246,214,186],[232,239,245],[214,233,247],[236,212,170],[230,140,92],[38,47,74]], RID=[[96,92,110],[74,96,108],[59,86,96],[78,84,92],[70,52,62],[20,26,42]];
function mix(a,b,t){return a.map(function(v,i){return Math.round(v+(b[i]-v)*t);});}
function at(arr,p){var f=p*(arr.length-1),i=Math.min(arr.length-2,Math.floor(f));return mix(arr[i],arr[i+1],f-i);}
function onLang(d){
  slot.innerHTML=d.slots.map(function(s){return '<article><h3>'+s[1]+'</h3><p>'+s[2]+'</p></article>';}).join("");
  ticks.innerHTML=d.slots.map(function(){return "<span></span>";}).join("");
  cur=-1; qa(document.getElementById("qs"), d.qs, "q"); onScroll();
}
function onScroll(){
  var p=RM?0.4:Math.max(0,Math.min(1,progress(dayEl)));
  var pt=arcp.getPointAtLength(L*(0.04+p*0.92)), box=arcSvg.getBoundingClientRect(), sb=st.getBoundingClientRect();
  sun.style.left=(box.left-sb.left+pt.x/1000*box.width)+"px"; sun.style.top=(box.top-sb.top+pt.y/500*box.height)+"px";
  var s=at(SKY,p), r=at(RID,p); st.style.setProperty("--skyc","rgb("+s+")"); st.style.setProperty("--ridge","rgb("+r+")");
  var dark=p>0.82; st.style.setProperty("--clk",dark?"#F2EDE3":"#1F2430"); st.style.setProperty("--clp",dark?"#B9C1D3":"#4D5363");
  st.style.setProperty("--sunc",p>0.7?"#E5652E":"#F2A33A");
  var d=T[lang].slots, i=Math.min(d.length-1,Math.floor(p*d.length));
  var f=p*d.length-i, hm=function(t){t=t.split(":");return +t[0]*60+ +t[1];}, a0=hm(d[i][0]), a1=i<d.length-1?hm(d[i+1][0]):a0+60, mins=Math.round(a0+(a1-a0)*Math.min(1,f)); clk.textContent=String(Math.floor(mins/60)).padStart(2,"0")+":"+String(Math.floor(mins%60/15)*15).padStart(2,"0");
  if(i!==cur){cur=i; slot.querySelectorAll("article").forEach(function(a,k){a.classList.toggle("on",k===i);}); ticks.querySelectorAll("span").forEach(function(a,k){a.classList.toggle("on",k===i);});}
}
addEventListener("resize",onScroll);
boot();
</script>
