<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oriz · The road to the Roof of the World</title>
<meta name="description" content="Private Pamir Highway tours with Oriz, a Pamiri guide from Dushanbe. Wakhan Valley, Fann Mountains, Iskanderkul. English, Russian, German.">
<meta property="og:title" content="Oriz · The road to the Roof of the World">
<meta property="og:description" content="Private Pamir Highway tours with a Pamiri guide from Dushanbe.">
<meta name="theme-color" content="#F3ECE0">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Golos+Text:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<!-- Demo for Oriz (Pamiri guide, Dushanbe). Facts from his public guide profile. Itinerary, stays and contacts are to be confirmed with him. -->
<style>
:root{
  --paper:#F3ECE0; --paper-2:#EAE0CF; --ink:#1F1A16; --ink-2:#5A4E44; --rule:#D8CBB6;
  --apricot:#C9541F; --apricot-2:#A9431A; --glacier:#2E6E8C; --night:#17130F;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Golos Text',system-ui,sans-serif; --hand:'Caveat',cursive;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --wrap:1180px; --pad:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;overflow-x:hidden}
::selection{background:var(--apricot);color:#fff}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:4px}
:focus-visible{outline:2px solid var(--glacier);outline-offset:4px;border-radius:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.serif{font-family:var(--serif)}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:12px;z-index:99;background:var(--ink);color:var(--paper);padding:10px 14px}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:40;transition:background .35s var(--ease-out),color .35s,box-shadow .35s;color:#fff}
header.solid{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--rule)}
.hbar{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.logo{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:-.01em;text-decoration:none;line-height:1}
.logo small{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;opacity:.75;margin-left:8px;vertical-align:4px}
.hright{display:flex;align-items:center;gap:6px}
.lang{display:flex;gap:2px}
.lang button{border:0;background:none;color:inherit;font:600 13px var(--sans);padding:10px 8px;min-height:44px;cursor:pointer;opacity:.6;border-bottom:2px solid transparent}
.lang button[aria-pressed="true"]{opacity:1;border-bottom-color:currentColor}
.hwa{margin-left:10px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid currentColor;border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;transition:background .2s,color .2s,transform .16s var(--ease-out)}
.hwa:hover{background:currentColor}.hwa:hover span{color:var(--paper)}
header:not(.solid) .hwa:hover span{color:var(--ink)}
.hwa:active{transform:scale(.97)}

/* hero */
.hero{position:relative;height:100svh;min-height:620px;color:#fff;overflow:hidden;background:#3a3029}
.hero .ph{position:absolute;inset:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,19,15,.35) 0%,rgba(23,19,15,.05) 35%,rgba(23,19,15,.70) 100%)}
.hero-copy{position:absolute;left:0;right:0;bottom:0;z-index:2;padding-bottom:clamp(40px,7vh,84px)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(52px,9vw,128px);line-height:.92;letter-spacing:-.02em;max-width:11ch;text-wrap:balance}
.hero h1 em{font-style:italic;font-weight:500}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-top:28px;flex-wrap:wrap}
.hero p{max-width:46ch;font-size:clamp(16px,1.5vw,19px);color:rgba(255,255,255,.9)}
.cta{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;background:var(--apricot);color:#fff;text-decoration:none;font-weight:600;font-size:16px;border:0;cursor:pointer;transition:background .2s,transform .16s var(--ease-out);box-shadow:0 10px 24px -8px rgba(201,84,31,.55)}
.cta:hover{background:var(--apricot-2)}.cta:active{transform:scale(.97)}
.cta svg{width:20px;height:20px}
.alt{font-size:13px;color:rgba(255,255,255,.7);margin-top:10px}

/* photos (Wikimedia Commons, with a quiet fallback) */
.ph{background:var(--paper-2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s var(--ease-out)}
.ph img.ok{opacity:1}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:clamp(22px,3vw,40px);color:rgba(31,26,22,.28);text-align:center;padding:20px}
.hero .ph .fb{color:rgba(255,255,255,.18);background:linear-gradient(160deg,#6b5646,#2c241e)}

/* letter */
.letter{padding:clamp(90px,14vh,150px) 0 clamp(70px,10vh,110px)}
.letter-grid{display:grid;grid-template-columns:7fr 4fr;gap:clamp(36px,6vw,90px);align-items:end}
.letter .lede{font-family:var(--serif);font-size:clamp(30px,3.6vw,50px);line-height:1.12;font-weight:500;letter-spacing:-.01em;text-wrap:pretty}
.letter .lede em{color:var(--apricot);font-style:italic}
.letter .body{margin-top:28px;max-width:62ch;color:var(--ink-2)}
.sign{font-family:var(--hand);font-size:44px;color:var(--apricot);line-height:1;margin-top:26px;transform:rotate(-3deg);transform-origin:left;display:inline-block}
.facts{list-style:none;border-top:1px solid var(--ink)}
.facts li{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--rule);font-size:15px}
.facts li b{font-weight:600}
.facts li span{color:var(--ink-2);text-align:right}

/* route map: the authored moment */
.route{position:relative;background:var(--night);color:#EFE6D8}
.route-sticky{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:center;overflow:hidden;padding-top:70px}
.route-sticky>.wrap{width:100%;min-width:0}
.route h2{font-family:var(--serif);font-weight:600;font-size:clamp(40px,5.4vw,78px);line-height:.98;letter-spacing:-.015em;max-width:14ch}
.route .sub{color:#B9AC99;max-width:52ch;margin-top:16px}
.map{width:100%;height:auto;margin-top:clamp(18px,4vh,40px);overflow:visible}
.map .base{fill:none;stroke:rgba(239,230,216,.14);stroke-width:2;stroke-dasharray:3 7}
.map .line{fill:none;stroke:var(--apricot);stroke-width:3.5;stroke-linecap:round}
.stop circle{fill:var(--night);stroke:rgba(239,230,216,.35);stroke-width:2;transition:fill .4s var(--ease-out),stroke .4s}
.stop text{fill:#EFE6D8;font:500 15px var(--sans);opacity:.25;transition:opacity .5s var(--ease-out)}
.stop .alt-t{font-size:12.5px;fill:#B9AC99}
.stop.on circle{fill:var(--apricot);stroke:var(--apricot)}
.stop.on text{opacity:1}
.stop.peak.on circle{fill:#fff;stroke:#fff}
.route-note{position:absolute;right:var(--pad);bottom:28px;font-size:12.5px;color:#8E8170}

/* stages: a horizontal walk through the trip */
.stages{position:relative;background:var(--paper)}
.st-head{padding-top:clamp(90px,12vh,140px)}
.st-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(38px,4.6vw,66px);line-height:1;letter-spacing:-.015em}
.st-head p{color:var(--ink-2);margin-top:12px;max-width:56ch}
.st-pin{position:relative}
.st-track{display:flex;gap:28px;padding:44px var(--pad) 90px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--apricot) var(--paper-2)}
.stage{flex:0 0 min(78vw,420px);scroll-snap-align:start}
.stage .ph{position:relative;aspect-ratio:4/5;border-radius:4px}
.stage .day{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--apricot);margin-top:16px}
.stage h3{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.05;margin-top:2px}
.stage p{color:var(--ink-2);font-size:15.5px;margin-top:8px;max-width:38ch}
html.pin .st-pin{height:var(--pinh,300vh)}
html.pin .st-sticky{position:sticky;top:0;height:100svh;display:flex;align-items:center;overflow:hidden}
html.pin .st-track{overflow:visible;padding-bottom:0;will-change:transform}

/* other routes: typographic index */
.index{padding:clamp(90px,12vh,140px) 0;border-top:1px solid var(--rule)}
.index h2{font-family:var(--serif);font-weight:600;font-size:clamp(38px,4.6vw,66px);line-height:1;letter-spacing:-.015em;margin-bottom:40px}
.ix{list-style:none;border-top:1px solid var(--ink)}
.ix a{display:grid;grid-template-columns:1fr auto auto;gap:24px;align-items:baseline;padding:26px 0;border-bottom:1px solid var(--rule);text-decoration:none;transition:padding .35s var(--ease-out),color .2s}
.ix .nm{font-family:var(--serif);font-size:clamp(28px,3.4vw,46px);font-weight:600;line-height:1.05}
.ix .ds{color:var(--ink-2);font-size:15px;max-width:40ch}
.ix .dr{font-weight:600;font-size:14px;color:var(--apricot);white-space:nowrap}
.ix .th{display:none}
@media (hover:hover) and (pointer:fine){
  .ix a:hover{padding-left:18px;color:var(--apricot-2)}
}
.peek{position:fixed;left:0;top:0;width:300px;aspect-ratio:4/3;pointer-events:none;z-index:30;border-radius:4px;opacity:0;transform:translate(-50%,-50%) scale(.95);transition:opacity .25s var(--ease-out),transform .25s var(--ease-out);box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.peek .ph{position:absolute;inset:0;border-radius:4px}

/* questions written for this trip */
.qa{background:var(--paper-2);padding:clamp(90px,12vh,140px) 0}
.qa-grid{display:grid;grid-template-columns:4fr 7fr;gap:clamp(36px,6vw,90px)}
.qa h2{font-family:var(--serif);font-weight:600;font-size:clamp(38px,4.6vw,66px);line-height:1;letter-spacing:-.015em}
.qa .side p{color:var(--ink-2);margin-top:16px;max-width:36ch}
.qa .side .hand{font-family:var(--hand);font-size:30px;color:var(--apricot);margin-top:22px;line-height:1.1}
.q{border-top:1px solid var(--ink)}
.q:last-child{border-bottom:1px solid var(--ink)}
.q button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;background:none;border:0;padding:24px 0;text-align:left;font:600 19px/1.35 var(--sans);color:var(--ink);cursor:pointer;min-height:44px}
.q button i{flex:none;width:28px;height:28px;position:relative}
.q button i::before,.q button i::after{content:"";position:absolute;left:4px;right:4px;top:13px;height:2px;background:var(--apricot);transition:transform .3s var(--ease-out)}
.q button i::after{transform:rotate(90deg)}
.q button[aria-expanded="true"] i::after{transform:rotate(0)}
.q .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease-out)}
.q .a>div{overflow:hidden}
.q .a p{padding:0 0 24px;color:var(--ink-2);max-width:64ch}
.q button[aria-expanded="true"]+.a{grid-template-rows:1fr}

/* postcard */
.write{padding:clamp(90px,12vh,140px) 0}
.card{display:grid;grid-template-columns:1fr 1fr;background:#FBF7EF;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 40px 80px -40px rgba(60,40,20,.35);position:relative;overflow:hidden}
.card-l{padding:clamp(28px,4vw,56px);border-right:1px solid var(--rule);display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.card-l h2{font-family:var(--serif);font-weight:600;font-size:clamp(36px,4.2vw,58px);line-height:1;letter-spacing:-.015em}
.card-l .note{font-family:var(--hand);font-size:clamp(26px,2.6vw,34px);line-height:1.15;color:var(--ink-2)}
.chan{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px}
.chan a{font-weight:600}
.card-r{padding:clamp(28px,4vw,56px);position:relative}
.stamp{position:absolute;top:26px;right:26px;width:92px;height:110px;border:2px dashed var(--apricot);border-radius:4px;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.1;color:var(--apricot);transform:rotate(4deg);padding:8px}
form{display:grid;gap:4px;margin-top:110px}
.f{display:grid;grid-template-columns:130px 1fr;align-items:end;gap:14px;border-bottom:1px solid var(--rule);padding:12px 0 6px}
.f label{font-size:13px;color:var(--ink-2);font-weight:600;padding-bottom:8px}
.f input,.f select,.f textarea{border:0;background:none;font:400 18px var(--sans);color:var(--ink);padding:8px 0;min-height:44px;width:100%;outline:none;resize:none;border-radius:0}
.f:focus-within{border-bottom-color:var(--apricot)}
.f.bad{border-bottom-color:#B3261E}
.err{grid-column:2;color:#B3261E;font-size:13px;display:none}
.f.bad .err{display:block}
.send{margin-top:26px;justify-self:start}
.fine{font-size:13px;color:var(--ink-2);margin-top:12px}
.ready{display:none;margin-top:14px;font-weight:600}
.ready.show{display:block}
.ready a{color:var(--glacier)}

footer{border-top:1px solid var(--rule);padding:30px 0 120px;font-size:13.5px;color:var(--ink-2)}
.fgrid{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.credits a{color:inherit}

/* image reveal: clip from the bottom edge */
html.js .rev{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s var(--ease-io)}
html.js .rev.in{clip-path:inset(0 0 0 0)}

.mbar{display:none}

@media (max-width:900px){
  .letter-grid,.qa-grid,.card{grid-template-columns:1fr}
  .card-l{border-right:0;border-bottom:1px solid var(--rule)}
  .ix a{grid-template-columns:72px 1fr;grid-template-areas:"th nm" "th dr" "ds ds";gap:4px 16px}
  .ix .th{display:block;grid-area:th;position:relative;width:72px;height:72px;border-radius:4px}
  .ix .nm{grid-area:nm}.ix .dr{grid-area:dr}.ix .ds{grid-area:ds;margin-top:10px}
  .route-note{position:static;margin:16px var(--pad) 0}
}
@media (max-width:620px){
  :root{--pad:20px}
  .logo small,.hwa span{display:none}
  .hwa{padding:0;width:44px;justify-content:center}
  .hero h1{font-size:52px}
  .hero-row{flex-direction:column;align-items:flex-start}
  .map-wrap{margin:0 calc(-1 * var(--pad));padding:0 var(--pad);overflow:hidden}
  .map{width:900px;max-width:none;will-change:transform}
  .stop text{font-size:19px}.stop .alt-t{font-size:15px}
  .f{grid-template-columns:1fr;gap:0}
  .f label{padding-bottom:0}
  .err{grid-column:1}
  form{margin-top:120px}
  .mbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:45;transform:translateY(140%);transition:transform .35s var(--ease-out)}
  .mbar.on{transform:none}
  .mbar .cta{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
  html.js .rev{clip-path:none}
}
</style>
</head>
<body>
<a class="skip" href="#main" data-t="skip"></a>
<header id="hd">
  <div class="wrap hbar">
    <a class="logo" href="#top">Oriz<small data-t="logo_s"></small></a>
    <div class="hright">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button type="button" data-lang="tg" aria-pressed="false">TJ</button>
      </div>
      <a class="hwa" href="#write" aria-label="WhatsApp"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg><span data-t="hwa"></span></a>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" id="top">
    <div class="ph" data-photo="Pamir_Highway_-_Tajikistan.jpg|Pamir_Highway-1.jpg|Pamir_road_near_Kalaykhumb.jpg" data-w="1920"></div>
    <div class="hero-copy wrap">
      <h1 data-t="h1" data-html="1"></h1>
      <div class="hero-row">
        <p data-t="hero_p"></p>
        <div><a class="cta" href="#write"><span data-t="cta"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div class="alt" data-t="cta_alt"></div></div>
      </div>
    </div>
  </section>

  <section class="letter">
    <div class="wrap letter-grid">
      <div>
        <p class="lede" data-t="lede" data-html="1"></p>
        <p class="body" data-t="letter"></p>
        <span class="sign" data-t="sign"></span>
      </div>
      <ul class="facts">
        <li><b data-t="k1"></b><span data-t="v1"></span></li>
        <li><b data-t="k2"></b><span data-t="v2"></span></li>
        <li><b data-t="k3"></b><span data-t="v3"></span></li>
        <li><b data-t="k4"></b><span data-t="v4"></span></li>
      </ul>
    </div>
  </section>

  <section class="route" id="route" style="height:260vh">
    <div class="route-sticky">
      <div class="wrap">
        <h2 data-t="route_h"></h2>
        <p class="sub" data-t="route_p"></p>
        <div class="map-wrap"><svg class="map" viewBox="0 0 1000 420" aria-hidden="true">
          <path id="rp" d="M40,330 C130,320 170,250 250,262 S360,330 420,268 S500,150 560,186 S650,300 720,230 S800,110 870,120 S940,80 965,60" />
        </svg></div>
      </div>
      <p class="route-note" data-t="route_note"></p>
    </div>
  </section>

  <section class="stages">
    <div class="wrap st-head"><h2 data-t="st_h"></h2><p data-t="st_p"></p></div>
    <div class="st-pin"><div class="st-sticky"><div class="st-track" id="track">
      <article class="stage"><div class="ph rev" data-photo="Pamir_road_near_Kalaykhumb.jpg|Panj_river_landscape.jpg"></div><div class="day" data-t="d1d"></div><h3 data-t="d1h"></h3><p data-t="d1p"></p></article>
      <article class="stage"><div class="ph rev" data-photo="Along_the_Afghan_border_(8)_(30886746896).jpg|Panj_river_landscape.jpg"></div><div class="day" data-t="d2d"></div><h3 data-t="d2h"></h3><p data-t="d2p"></p></article>
      <article class="stage"><div class="ph rev" data-photo="Into_the_Wakhan_Valley_(4)_(31528121094).jpg|Temple_Vrang.jpg"></div><div class="day" data-t="d3d"></div><h3 data-t="d3h"></h3><p data-t="d3p"></p></article>
      <article class="stage"><div class="ph rev" data-photo="Temple_Vrang.jpg|Panj_river_landscape.jpg"></div><div class="day" data-t="d4d"></div><h3 data-t="d4h"></h3><p data-t="d4p"></p></article>
      <article class="stage"><div class="ph rev" data-photo="From_Langar_to_Murghab_(30357439658).jpg|Alichur_TJ.JPG"></div><div class="day" data-t="d5d"></div><h3 data-t="d5h"></h3><p data-t="d5p"></p></article>
      <article class="stage"><div class="ph rev" data-photo="Ak-Baital_Pass.jpg|Border_Pamir_highway_China.jpg"></div><div class="day" data-t="d6d"></div><h3 data-t="d6h"></h3><p data-t="d6p"></p></article>
    </div></div></div>
  </section>

  <section class="index">
    <div class="wrap">

  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=d[el.dataset.ph]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false");});
  document.querySelectorAll(".stop .nm-t").forEach(function(t,i){t.textContent=STOPS[i][lang==="en"?0:lang==="ru"?1:2];});
  document.querySelectorAll(".stop .alt-t").forEach(function(t){var v=t.dataset.v; t.textContent=lang==="en"?v:v.replace(" m"," м");});
  renderQs(); document.querySelectorAll(".stage .fb").forEach(function(f){var h=f.closest(".stage").querySelector("h3"); if(h) f.textContent=h.textContent;}); document.title=d.title; try{localStorage.setItem("oriz2-lang",lang);}catch(e){}
}
function renderQs(){
  var box=document.getElementById("qs"), open=[].map.call(box.querySelectorAll("button"),function(b){return b.getAttribute("aria-expanded")==="true";});
  box.innerHTML=""; T[lang].qs.forEach(function(q,i){

/* route map: stops placed on the real path */
var svg=document.querySelector(".map"), path=document.getElementById("rp"), NS="http://www.w3.org/2000/svg";
var base=path.cloneNode(); base.removeAttribute("id"); base.setAttribute("class","base"); svg.insertBefore(base,path); path.setAttribute("class","line");
var L=path.getTotalLength(); path.style.strokeDasharray=L; path.style.strokeDashoffset=L;
STOPS.forEach(function(s,i){var pt=path.getPointAtLength(L*s[4]), g=document.createElementNS(NS,"g"); g.setAttribute("class","stop"+(s[5]?" peak":"")); g.dataset.at=s[4];
  var below=(i%2===1); g.innerHTML='<circle r="7" cx="'+pt.x+'" cy="'+pt.y+'"/><text class="nm-t" x="'+pt.x+'" y="'+(pt.y+(below?32:-18))+'" text-anchor="middle"></text>'+(s[3]?'<text class="alt-t" data-v="'+s[3]+'" x="'+pt.x+'" y="'+(pt.y+(below?52:-38))+'" text-anchor="middle"></text>':''); svg.appendChild(g);});

document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang);});});
(function(){var l=null;try{l=localStorage.getItem("oriz2-lang");}catch(e){} if(!l){var n=(navigator.language||"en").toLowerCase(); l=n.indexOf("ru")===0?"ru":n.indexOf("tg")===0?"tg":"en";} setLang(l);})();

var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var hd=document.getElementById("hd"), route=document.getElementById("route"), stops=svg.querySelectorAll(".stop"), mbar=document.querySelector(".mbar"), hero=document.querySelector(".hero"), write=document.getElementById("write");
var pin=document.querySelector(".st-pin"), track=document.getElementById("track"), usePin=!RM && matchMedia("(min-width: 901px)").matches;
if(usePin){document.documentElement.classList.add("pin");}
function sizePin(){ if(!usePin)return; var extra=Math.max(0,track.scrollWidth-innerWidth); pin.style.setProperty("--pinh",(innerHeight+extra)+"px"); }
sizePin(); addEventListener("resize",sizePin);
var tick=false;
function frame(){
  tick=false; var y=scrollY;
  hd.classList.toggle("solid", y>innerHeight*0.85);
  var r=route.getBoundingClientRect(), p=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)));
  if(RM) p=1;
  path.style.strokeDashoffset=(L*(1-p)).toFixed(1);
  if(innerWidth<=620){var mw=svg.getBoundingClientRect().width, sh=Math.max(0,mw-(innerWidth-40)); svg.style.transform="translate3d("+(-sh*p).toFixed(1)+"px,0,0)";} else svg.style.transform="";
  stops.forEach(function(s){s.classList.toggle("on",p>=+s.dataset.at-0.001);});
  if(usePin){var pr=pin.getBoundingClientRect(), max=track.scrollWidth-innerWidth, k=Math.min(1,Math.max(0,-pr.top/(pr.height-innerHeight))); track.style.transform="translate3d("+(-max*k).toFixed(1)+"px,0,0)";}
  var w=write.getBoundingClientRect(); mbar.classList.toggle("on", hero.getBoundingClientRect().bottom<0 && !(w.top<innerHeight && w.bottom>0));
}
addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(frame);}},{passive:true}); frame();

/* image reveal */
(function(){var els=document.querySelectorAll(".rev"); if(RM||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -10% 0px"});
 els.forEach(function(e){io.observe(e);}); if(usePin) els.forEach(function(e){e.classList.add("in");});})();

/* photo loader with honest fallback */
var used=[];
function credit(n){if(used.indexOf(n)>-1)return; used.push(n); var a=document.createElement("a"); a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(n); a.target="_blank"; a.rel="noopener"; a.textContent=used.length; var cl=document.getElementById("cl"); if(cl.childNodes.length)cl.appendChild(document.createTextNode(" ")); cl.appendChild(a); document.getElementById("credits").hidden=false;}
function loadPhoto(el,list){
  el.innerHTML=""; if(getComputedStyle(el).position==="static") el.style.position="relative";
  var fb=document.createElement("span"); fb.className="fb"; var lab=el.parentElement.querySelector("h3,.nm"); if(lab&&!el.classList.contains("th")) fb.textContent=lab.textContent; el.appendChild(fb);
  var img=new Image(); img.alt=""; img.decoding="async"; if(!el.closest(".hero")) img.loading="lazy";
  var w=el.dataset.w||900;
  img.onload=function(){if(img.naturalWidth>50){img.classList.add("ok");fb.remove();credit(img.dataset.n);}};
  img.onerror=function(){var n=list.shift(); if(n){img.dataset.n=n; img.src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(n)+"?width="+w;} else img.remove();};
  el.appendChild(img); img.onerror();
}
document.querySelectorAll(".ph[data-photo]").forEach(function(el){loadPhoto(el,el.dataset.photo.split("|"));});

/* index hover preview (mouse only) */
if(matchMedia("(hover: hover) and (pointer: fine)").matches){
  var peek=document.getElementById("peek"), pph=document.getElementById("peekph"), cur=null, px=0, py=0, tx=0, ty=0, raf=null;
  function mv(){tx+=(px-tx)*0.18; ty+=(py-ty)*0.18; peek.style.left=tx+"px"; peek.style.top=ty+"px"; raf=requestAnimationFrame(mv);}
  document.querySelectorAll(".ix a").forEach(function(a){
    a.addEventListener("mouseenter",function(e){var k=a.dataset.photoK; if(cur!==k){cur=k; loadPhoto(pph,[k]);} tx=px=e.clientX; ty=py=e.clientY; peek.classList.add("on"); if(!raf) mv();});
    a.addEventListener("mousemove",function(e){px=e.clientX+170; py=e.clientY;});
    a.addEventListener("mouseleave",function(){peek.classList.remove("on"); cancelAnimationFrame(raf); raf=null;});
  });
}
