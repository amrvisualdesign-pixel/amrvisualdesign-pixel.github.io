<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:4px}
button{font:inherit;color:inherit}
.skip{position:absolute;left:-9999px}.skip:focus{left:14px;top:12px;z-index:99;background:#111;color:#fff;padding:10px 14px}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s cubic-bezier(.23,1,.32,1)}
.ph img.ok{opacity:1}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.23,1,.32,1)}
.qa-a>div{overflow:hidden}
button[aria-expanded="true"]+.qa-a{grid-template-rows:1fr}
.ready{display:none}.ready.show{display:block}
[data-field] .err{display:none}[data-field].bad .err{display:block}
.mbar{display:none}
@media (max-width:620px){.mbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:45;transform:translateY(150%);transition:transform .35s cubic-bezier(.23,1,.32,1)}.mbar.on{transform:none}.mbar>*{flex:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

:root{--bg:#0F1C17;--bg-2:#16271F;--line:#28402F;--txt:#E9EDE4;--mut:#9DAE9F;--or:#F07A2E;--or-2:#D9661E;--d:'Oswald',system-ui,sans-serif;--b:'PT Sans',system-ui,sans-serif;--e:cubic-bezier(.23,1,.32,1);--pad:28px}
body{background:var(--bg);color:var(--txt);font:400 18px/1.6 var(--b)}
::selection{background:var(--or);color:#111}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
.w{max-width:1200px;margin:0 auto;padding:0 var(--pad)}
header{position:fixed;inset:0 0 auto;z-index:40;transition:background .3s var(--e)}
header.solid{background:var(--bg);box-shadow:0 1px 0 var(--line)}
.hb{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font:700 22px var(--d);text-transform:uppercase;letter-spacing:.06em;text-decoration:none}
.logo span{color:var(--or)}
.r{display:flex;align-items:center;gap:6px}
.lang button{background:none;border:0;cursor:pointer;font:600 13px var(--d);letter-spacing:.08em;padding:10px 7px;min-height:44px;color:var(--mut)}
.lang button[aria-pressed="true"]{color:var(--txt);text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--or)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;background:var(--or);color:#111;font:600 15px var(--d);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer;transition:transform .16s var(--e),background .2s}
.btn:hover{background:#FF8D45}.btn:active{transform:scale(.97)}
.btn.ln{background:none;color:var(--txt);box-shadow:inset 0 0 0 1px var(--txt)}
/* hero */
.hero{position:relative;height:100svh;min-height:640px;overflow:hidden}
.hero .ph{position:absolute;inset:0}
.hero .ph .fb{font:700 clamp(30px,5vw,70px) var(--d);text-transform:uppercase;color:rgba(255,255,255,.1);background:#1E3328}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,28,23,.35),rgba(15,28,23,.2) 40%,rgba(15,28,23,.92))}
.hero .copy{position:absolute;left:0;right:0;bottom:0;z-index:2;padding-bottom:clamp(36px,7vh,80px)}
.coord{font:500 14px var(--d);letter-spacing:.2em;color:var(--or)}
.hero h1{font:700 clamp(56px,11vw,170px)/.86 var(--d);text-transform:uppercase;letter-spacing:-.01em;margin-top:12px}
.hero p{max-width:50ch;color:#D4DCD2;margin-top:22px}
.hero .acts{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
/* field note */
.note{padding:clamp(90px,13vh,150px) 0;border-bottom:1px solid var(--line)}
.ng{display:grid;grid-template-columns:3fr 5fr;gap:clamp(30px,6vw,90px)}
.ng h2{font:600 clamp(30px,3.6vw,50px)/1.02 var(--d);text-transform:uppercase}
.ng p{color:#C9D3C7;max-width:62ch}
.ng p+p{margin-top:16px}
.places{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.places span{font:500 14px var(--d);letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border:1px solid var(--line);color:var(--mut)}
/* profile: drawn on scroll */
.prof{height:240vh;position:relative}
.prof .st{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.prof h2{font:700 clamp(36px,5vw,72px)/.95 var(--d);text-transform:uppercase}
.prof .sub{color:var(--mut);margin-top:12px;max-width:56ch}
.chart{width:100%;height:auto;margin-top:clamp(20px,5vh,50px);overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .grid text{fill:var(--mut);font:500 13px var(--d);letter-spacing:.06em}
.chart .area{fill:url(#ga);opacity:0;transition:opacity .6s var(--e)}
.chart .area.on{opacity:1}
.chart .ln{fill:none;stroke:var(--or);stroke-width:3}
.pt circle{fill:var(--bg);stroke:var(--or);stroke-width:3;opacity:0;transition:opacity .4s var(--e)}
.pt.on circle{opacity:1}
.pt text{fill:var(--txt);font:600 15px var(--d);letter-spacing:.04em;text-transform:uppercase;opacity:0;transition:opacity .5s var(--e),transform .5s var(--e)}
.pt .h{fill:var(--or);font-size:24px}
.pt.on text{opacity:1}
.chart .note2{fill:var(--mut);font:400 12px var(--b)}
/* crew */
.crew{padding:clamp(90px,13vh,150px) 0;border-top:1px solid var(--line)}
.crew h2{font:700 clamp(36px,5vw,72px)/.95 var(--d);text-transform:uppercase;max-width:14ch}
.roles{margin-top:44px;border-top:1px solid var(--txt)}
.role{display:grid;grid-template-columns:1fr 1.3fr;gap:24px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line)}
.role b{font:600 clamp(28px,3.6vw,52px)/1 var(--d);text-transform:uppercase;transition:color .3s,transform .4s var(--e)}
.role span{color:var(--mut);max-width:48ch}
@media (hover:hover) and (pointer:fine){.role:hover b{color:var(--or);transform:translateX(10px)}}
/* trips */
.trips{background:var(--txt);color:#14211B;padding:clamp(90px,13vh,150px) 0}
.trips h2{font:700 clamp(36px,5vw,72px)/.95 var(--d);text-transform:uppercase}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.trip{display:flex;flex-direction:column}
.trip .ph{aspect-ratio:3/4}
.trip .ph .fb{font:700 24px var(--d);text-transform:uppercase;color:rgba(20,33,27,.2);background:#D5DCD1}
.trip .k{font:500 13px var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--or-2);margin-top:14px}
.trip h3{font:600 26px/1.05 var(--d);text-transform:uppercase;margin-top:4px}
.trip p{font-size:16px;color:#46564C;margin-top:8px;flex:1}
.trip .price{font:600 18px var(--d);margin-top:10px}
.trip a{margin-top:12px;font:600 14px var(--d);letter-spacing:.1em;text-transform:uppercase;color:#14211B;min-height:44px;display:inline-flex;align-items:center}
/* questions */
.faq{padding:clamp(90px,13vh,150px) 0}
.fg{display:grid;grid-template-columns:4fr 7fr;gap:clamp(30px,6vw,90px)}
.fg h2{font:700 clamp(36px,5vw,72px)/.95 var(--d);text-transform:uppercase}
.q{border-bottom:1px solid var(--line)}.q:first-child{border-top:1px solid var(--txt)}
.q button{width:100%;display:flex;justify-content:space-between;gap:18px;align-items:center;background:none;border:0;text-align:left;padding:22px 0;min-height:44px;cursor:pointer;font:600 20px/1.3 var(--d);letter-spacing:.02em;text-transform:uppercase;color:var(--txt)}
.q i{flex:none;width:18px;height:18px;border-right:2px solid var(--or);border-bottom:2px solid var(--or);transform:rotate(45deg) translate(-4px,-4px);transition:transform .3s var(--e)}
.q button[aria-expanded="true"] i{transform:rotate(225deg)}
.q p{padding:0 0 22px;color:#C9D3C7;max-width:62ch}
/* request */
.req{padding:0 0 clamp(90px,13vh,150px)}
.rbox{border:1px solid var(--or);padding:clamp(24px,4vw,56px);display:grid;grid-template-columns:4fr 7fr;gap:clamp(28px,5vw,70px)}
.rbox h2{font:700 clamp(32px,4.4vw,60px)/.95 var(--d);text-transform:uppercase}
.rbox .lead{color:var(--mut);margin-top:14px}
.rbox .ch{display:flex;gap:18px;margin-top:22px;font:600 15px var(--d);letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px}
[data-field]{display:flex;flex-direction:column;gap:6px}
[data-field].full{grid-column:1/-1}
label{font:500 12.5px var(--d);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
input,select,textarea{font:400 17px var(--b);background:var(--bg-2);border:1px solid var(--line);color:var(--txt);padding:13px 14px;min-height:50px;width:100%;border-radius:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
textarea{min-height:100px;resize:vertical}
.err{color:#FF9B8A;font-size:13px}
.fine{grid-column:1/-1;font-size:13px;color:var(--mut)}
.ready{grid-column:1/-1;font-weight:700}.ready a{color:var(--or)}
footer{border-top:1px solid var(--line);padding:26px 0 110px;color:var(--mut);font-size:13.5px}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:1000px){.tg{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.ng,.fg,.rbox,.role{grid-template-columns:1fr}.role{gap:6px}}
@media (max-width:620px){:root{--pad:18px}.tg{grid-template-columns:1fr}.hero h1{font-size:60px}.hb .btn{display:none}form{grid-template-columns:1fr}.pt text{font-size:17px}.pt .h{font-size:24px}.chart .grid text{font-size:14px}.chart .note2{font-size:13px}}
</style>
</head>

/* shared plumbing: languages, photos, WhatsApp form, header state. The design lives in each page. */
document.documentElement.classList.add("js");
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var lang = "en";
function setLang(l){
  lang = T[l] ? l : "en"; var d = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=d[el.dataset.t]; if(v!=null) el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(function(el){var v=d[el.dataset.th]; if(v!=null) el.innerHTML=v;});
  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=d[el.dataset.ph]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.lang===lang?"true":"false");});
  document.querySelectorAll(".ph .fb").forEach(function(f){var s=f.parentElement.dataset.label; if(s&&d[s]) f.textContent=d[s];});
  if(window.onLang) onLang(d);
  document.title = d.title;
  try{localStorage.setItem(SLUG+"-lang",lang);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang);});});

/* accordion helper for each page's own question markup */
function qa(box, items, cls){
  var open=[].map.call(box.querySelectorAll("button[aria-expanded]"),function(b){return b.getAttribute("aria-expanded")==="true";});
  box.innerHTML="";
  items.forEach(function(q,i){
    var id=box.id+"-a"+i, o=!!open[i];
    var wrap=document.createElement("div"); wrap.className=cls||"q";
    wrap.innerHTML='<button type="button" aria-expanded="'+o+'" aria-controls="'+id+'"><span class="qt"></span><i aria-hidden="true"></i></button><div class="qa-a" id="'+id+'"><div><p></p></div></div>';
    wrap.querySelector(".qt").textContent=q[0]; wrap.querySelector("p").textContent=q[1];
    wrap.querySelector("button").addEventListener("click",function(){this.setAttribute("aria-expanded",this.getAttribute("aria-expanded")==="true"?"false":"true");});
    box.appendChild(wrap);
  });
}

/* photographs from Wikimedia Commons; a named placeholder stays if none loads */
var used=[];
function credit(n){if(used.indexOf(n)>-1)return; used.push(n); var cl=document.getElementById("cl"); if(!cl)return; var a=document.createElement("a"); a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(n); a.target="_blank"; a.rel="noopener"; a.textContent=used.length; if(cl.childNodes.length)cl.appendChild(document.createTextNode(" ")); cl.appendChild(a); var c=document.getElementById("credits"); if(c)c.hidden=false;}
function loadPhoto(el, list){
  list = (list || el.dataset.photo || "").split("|").filter(Boolean);
  el.querySelectorAll("img,.fb").forEach(function(x){x.remove();});
  if(getComputedStyle(el).position==="static") el.style.position="relative";
  var fb=document.createElement("span"); fb.className="fb"; var s=el.dataset.label; if(s&&T[lang][s]) fb.textContent=T[lang][s]; el.appendChild(fb);
  var img=new Image(); img.alt=""; img.decoding="async"; if(!el.dataset.eager) img.loading="lazy";
  var w=el.dataset.w||1000;
  img.onload=function(){if(img.naturalWidth>50){img.classList.add("ok"); fb.remove(); credit(img.dataset.n);}};
  img.onerror=function(){var n=list.shift(); if(n){img.dataset.n=n; img.src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(n)+"?width="+w;} else img.remove();};
  el.appendChild(img); img.onerror();
}

/* WhatsApp form: every field with data-m becomes a line of the message */
function wireForm(){
  document.querySelectorAll("[data-wa]").forEach(function(a){a.href="https://wa.me/"+PHONE;});
  document.querySelectorAll("[data-tg]").forEach(function(a){a.href="https://t.me/"+TG;});
  var f=document.getElementById("form"); if(!f) return;
  f.addEventListener("submit",function(e){
    e.preventDefault(); var d=T[lang], n=document.getElementById("n"), box=n.closest("[data-field]");
    if(!n.value.trim()){box.classList.add("bad"); n.focus(); return;} box.classList.remove("bad");
    var lines=[d.hello];
    f.querySelectorAll("[data-m]").forEach(function(x){var v=x.tagName==="SELECT"?x.options[x.selectedIndex].textContent:x.value.trim(); if(v) lines.push((d[x.dataset.m]||"")+": "+v);});
    var a=document.getElementById("wa"); a.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(lines.join("\n"));
    document.getElementById("ready").classList.add("show"); a.focus();
  });
  document.querySelectorAll("[data-pick]").forEach(function(a){a.addEventListener("click",function(){var s=document.getElementById("r"); if(s) s.value=a.dataset.pick;});});
}

/* header turns solid after the first screen; the phone bar shows between hero and form */
function wireChrome(){
  var hd=document.querySelector("header"), hero=document.querySelector("[data-hero]"), mbar=document.querySelector(".mbar"), form=document.getElementById("form");
  var tick=false;
  function f(){tick=false; var hb=hero?hero.getBoundingClientRect().bottom:0;
    if(hd) hd.classList.toggle("solid", hb<80);
    if(mbar&&form){var r=form.getBoundingClientRect(); mbar.classList.toggle("on", hb<0 && !(r.top<innerHeight&&r.bottom>0));}
    if(window.onScroll) onScroll();}
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(f);}},{passive:true});
  addEventListener("resize",f); f();
}
function progress(el){var r=el.getBoundingClientRect(); return Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight)));}
function reveal(sel){var els=document.querySelectorAll(sel); if(RM||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"}); els.forEach(function(e){io.observe(e);});}

function boot(){
  var l=null; try{l=localStorage.getItem(SLUG+"-lang");}catch(e){}
  if(!l){var n=(navigator.language||"en").toLowerCase(); l=n.indexOf("ru")===0?"ru":n.indexOf("tg")===0?"tg":"en";}
  setLang(l);
  document.querySelectorAll(".ph[data-photo]").forEach(function(el){loadPhoto(el);});
  wireForm(); wireChrome();
}

/* elevation profile: three known heights, a smooth illustrative curve between them */
var NS="http://www.w3.org/2000/svg", chart=document.getElementById("chart"), ln=document.getElementById("ln"), area=document.getElementById("area");
var SM=matchMedia("(max-width:620px)").matches, VW=SM?600:1000, VH=SM?470:380;
chart.setAttribute("viewBox","0 0 "+VW+" "+VH);
var X0=SM?52:60,X1=VW-20,Y0=VH-50,Y1=SM?70:40, HMAX=6000;
function sx(x){return X0+(x-60)/900*(X1-X0);}
function y(h){return Y0-(h/HMAX)*(Y0-Y1);}
var P=[[60,y(1000)],[230,y(1500)],[360,y(2195)],[520,y(3200)],[650,y(4300)],[780,y(5489)],[960,y(4600)]].map(function(q){return [sx(q[0]),q[1]];});
var KEY=[0,2,5];
var d="M"+P[0][0]+","+P[0][1]; for(var i=1;i<P.length;i++){var a=P[i-1],b=P[i],mx=(a[0]+b[0])/2; d+=" C"+mx+","+a[1]+" "+mx+","+b[1]+" "+b[0]+","+b[1];}
ln.setAttribute("d",d); area.setAttribute("d",d+" L"+X1+","+Y0+" L"+X0+","+Y0+" Z");
var LEN=ln.getTotalLength(); ln.style.strokeDasharray=LEN; ln.style.strokeDashoffset=LEN;
var g=chart.querySelector(".grid"); [0,2000,4000,6000].forEach(function(h){g.insertAdjacentHTML("beforeend",'<line x1="'+X0+'" x2="'+X1+'" y1="'+y(h)+'" y2="'+y(h)+'"/><text class="gt" x="0" y="'+(y(h)+5)+'" data-h="'+h+'"></text>');});
var pts=KEY.map(function(k,i){var gg=document.createElementNS(NS,"g"); gg.setAttribute("class","pt"); gg.dataset.at=[0,0.33,0.78][i];
  gg.innerHTML='<circle r="7" cx="'+P[k][0]+'" cy="'+P[k][1]+'"/><text class="h" x="'+P[k][0]+'" y="'+(P[k][1]-46)+'" text-anchor="'+(i===0?"start":"middle")+'"></text><text class="nm" x="'+P[k][0]+'" y="'+(P[k][1]-20)+'" text-anchor="'+(i===0?"start":"middle")+'"></text>'; chart.appendChild(gg); return gg;});
var nt=document.createElementNS(NS,"text"); nt.setAttribute("class","note2"); nt.setAttribute("x",X1); nt.setAttribute("y",VH-8); nt.setAttribute("text-anchor","end"); chart.appendChild(nt);
function onLang(d){
  pts.forEach(function(p,i){p.querySelector(".h").textContent=d.pk[i][1]; p.querySelector(".nm").textContent=d.pk[i][0];});
  chart.querySelectorAll(".gt").forEach(function(t){t.textContent=(+t.dataset.h).toLocaleString(lang==="en"?"en-US":"ru-RU")+" "+d.unit;});
  nt.textContent=d.approx; qa(document.getElementById("qs"), d.qs, "q");
}
var prof=document.getElementById("prof");
function onScroll(){var p=RM?1:Math.min(1,progress(prof)*1.25); ln.style.strokeDashoffset=(LEN*(1-p)).toFixed(1); pts.forEach(function(x){x.classList.toggle("on",p>=+x.dataset.at);}); area.classList.toggle("on",p>0.98);}
boot();
</script>
