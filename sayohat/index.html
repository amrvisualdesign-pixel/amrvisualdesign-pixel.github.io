<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:4px}
button{font:inherit;color:inherit}
.skip{position:absolute;left:-9999px}.skip:focus{left:14px;top:12px;z-index:99;background:#111;color:#fff;padding:10px 14px}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s cubic-bezier(.23,1,.32,1)}
.ph img.ok{opacity:1}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.23,1,.32,1)}
.qa-a>div{overflow:hidden}
button[aria-expanded="true"]+.qa-a{grid-template-rows:1fr}
.ready{display:none}.ready.show{display:block}
[data-field] .err{display:none}[data-field].bad .err{display:block}
.mbar{display:none}
@media (max-width:620px){.mbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:45;transform:translateY(150%);transition:transform .35s cubic-bezier(.23,1,.32,1)}.mbar.on{transform:none}.mbar>*{flex:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

:root{--tq:#0F6E6A;--tq-2:#0B5754;--tq-l:#DDF1EE;--co:#FF6B57;--co-2:#E9533F;--ink:#10201F;--mut:#4F6261;--bg:#F7FBFA;--f:'Rubik',system-ui,sans-serif;--e:cubic-bezier(.23,1,.32,1);--pad:28px}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--f)}
::selection{background:var(--co);color:#fff}
:focus-visible{outline:3px solid var(--co);outline-offset:3px}
.w{max-width:1200px;margin:0 auto;padding:0 var(--pad)}
header{position:fixed;inset:0 0 auto;z-index:40;transition:background .3s var(--e)}
header.solid{background:var(--bg);box-shadow:0 1px 0 rgba(16,32,31,.08)}
.hb{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font:800 24px var(--f);letter-spacing:-.02em;text-decoration:none;color:#fff;transition:color .3s}
header.solid .logo{color:var(--ink)}
.logo span{color:var(--co)}
.r{display:flex;align-items:center;gap:6px}
.lang button{background:none;border:0;cursor:pointer;font:600 13px var(--f);padding:10px 7px;min-height:44px;color:rgba(255,255,255,.7)}
.lang button[aria-pressed="true"]{color:#fff}
header.solid .lang button{color:var(--mut)}header.solid .lang button[aria-pressed="true"]{color:var(--co-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:14px;white-space:nowrap;background:var(--co);color:#fff;font:600 16px var(--f);text-decoration:none;border:0;cursor:pointer;transition:transform .16s var(--e),background .2s}
.btn:hover{background:var(--co-2)}.btn:active{transform:scale(.97)}
.btn.wh{background:#fff;color:var(--ink)}.btn.wh:hover{background:var(--tq-l)}
/* hero: draggable comparison */
.hero{position:relative;height:100svh;min-height:620px;background:var(--tq);overflow:hidden;touch-action:pan-y;user-select:none}
.side{position:absolute;inset:0}
.side .ph{position:absolute;inset:0}
.side .ph .fb{font:800 clamp(30px,5vw,64px) var(--f);color:rgba(255,255,255,.14)}
.foot .ph .fb{background:#2B5A4D}.car .ph .fb{background:#6E5442}
.side::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,30,29,.45),rgba(8,30,29,.1) 40%,rgba(8,30,29,.75))}
.car{clip-path:inset(0 0 0 var(--x,50%))}
.lab{position:absolute;bottom:clamp(110px,18vh,170px);z-index:2;color:#fff;max-width:min(40vw,420px)}
.foot .lab{left:var(--pad)}.car .lab{right:var(--pad);text-align:right}
.lab b{display:block;font:800 clamp(40px,6.4vw,96px)/.9 var(--f);letter-spacing:-.03em}
.lab span{display:block;margin-top:12px;font-size:16.5px;color:rgba(255,255,255,.86)}
.handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:0;z-index:3}
.handle::before{content:"";position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:#fff}
.knob{position:absolute;top:50%;left:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;cursor:ew-resize;border:0;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);transition:transform .2s var(--e)}
.knob:active,.hero.drag .knob{transform:scale(1.08)}
.hero .ttl{position:absolute;left:0;right:0;top:96px;z-index:2;color:#fff;text-align:center;pointer-events:none}
.ttl h1{font:700 clamp(20px,2.2vw,28px)/1.2 var(--f);letter-spacing:-.01em}
.ttl p{font-size:15px;color:rgba(255,255,255,.8);margin-top:6px}
.hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:3;display:flex;gap:10px;align-items:center}
/* since */
.since{padding:clamp(90px,13vh,150px) 0}
.sg{display:grid;grid-template-columns:auto 1fr;gap:clamp(30px,6vw,90px);align-items:center}
.yr{font:800 clamp(100px,17vw,250px)/.8 var(--f);letter-spacing:-.05em;color:var(--tq)}
.since h2{font:700 clamp(30px,3.6vw,48px)/1.1 var(--f);letter-spacing:-.02em;max-width:20ch}
.since p{color:var(--mut);margin-top:16px;max-width:54ch}
/* tracks */
.tracks{padding:0 0 clamp(90px,13vh,150px)}
.tt{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.trk{border-radius:28px;padding:clamp(24px,3.4vw,40px);position:relative;overflow:hidden}
.trk.a{background:var(--tq);color:#fff}.trk.b{background:#FFE5E0}
.trk h3{font:700 clamp(28px,3vw,40px)/1.05 var(--f);letter-spacing:-.02em}
.trk>p{margin-top:10px;max-width:40ch}
.trk.a>p{color:rgba(255,255,255,.85)}.trk.b>p{color:var(--mut)}
.trk ul{list-style:none;margin-top:24px;display:grid;gap:2px}
.trk li{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-top:1px solid rgba(255,255,255,.22)}
.trk.b li{border-top-color:rgba(16,32,31,.12)}
.trk li b{font-weight:600}
.trk li span{font-size:15px;opacity:.75;text-align:right}
.trk a.go{display:inline-flex;align-items:center;min-height:44px;margin-top:16px;font-weight:600;color:inherit}
/* more */
.more{background:var(--ink);color:#E7F2F0;padding:clamp(80px,11vh,120px) 0}
.mg{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:clamp(20px,4vw,50px);align-items:start}
.more h2{font:700 clamp(30px,3.6vw,48px)/1.1 var(--f);letter-spacing:-.02em}
.mi b{display:block;font:700 22px var(--f);color:#fff}
.mi p{color:#A9C2BF;margin-top:8px;font-size:16.5px}
.mi svg{color:var(--co);margin-bottom:14px}
/* qa */
.qa{padding:clamp(90px,13vh,150px) 0}
.qa h2,.go2 h2{font:700 clamp(34px,4.4vw,58px)/1.05 var(--f);letter-spacing:-.02em}
.qg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:36px}
.q{background:#fff;border-radius:20px;padding:0 24px;box-shadow:0 1px 2px rgba(16,32,31,.05),0 16px 30px -24px rgba(16,32,31,.3);align-self:start}
.q button{width:100%;display:flex;justify-content:space-between;gap:18px;align-items:center;background:none;border:0;text-align:left;padding:22px 0;min-height:44px;cursor:pointer;font:600 18.5px/1.3 var(--f);color:var(--ink)}
.q i{flex:none;width:34px;height:34px;border-radius:12px;background:var(--tq-l);position:relative;transition:background .3s,transform .35s var(--e)}
.q i::before,.q i::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2.5px;border-radius:2px;background:var(--tq);transform:translate(-50%,-50%)}
.q i::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .3s var(--e)}
.q button[aria-expanded="true"] i{background:var(--co)}
.q button[aria-expanded="true"] i::before,.q button[aria-expanded="true"] i::after{background:#fff}
.q button[aria-expanded="true"] i::after{transform:translate(-50%,-50%) rotate(0)}
.q p{padding:0 0 22px;color:var(--mut)}
/* go */
.go2{padding:0 0 clamp(90px,13vh,150px)}
.gb{background:var(--tq);color:#fff;border-radius:32px;padding:clamp(26px,4.4vw,60px);display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(28px,5vw,70px)}
.gb .lead{color:rgba(255,255,255,.85);margin-top:14px}
.gb .ch{display:flex;gap:18px;margin-top:22px;font-weight:600;flex-wrap:wrap}.gb .ch a{color:#fff}
.mode{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.mode button{background:rgba(255,255,255,.12);border:0;color:#fff;font:600 15px var(--f);border-radius:12px;padding:0 18px;min-height:46px;cursor:pointer;transition:background .2s,color .2s}
.mode button[aria-pressed="true"]{background:#fff;color:var(--tq-2)}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
[data-field]{display:flex;flex-direction:column;gap:6px}
[data-field].full{grid-column:1/-1}
label{font:500 14px var(--f);color:rgba(255,255,255,.85)}
input,select,textarea{font:400 17px var(--f);background:#fff;border:2px solid transparent;color:var(--ink);padding:12px 14px;min-height:50px;width:100%;border-radius:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--co)}
textarea{min-height:96px;resize:vertical}
.err{color:#FFD9D2;font-size:13px}
.fine{grid-column:1/-1;font-size:13px;color:rgba(255,255,255,.75)}
.ready{grid-column:1/-1;font-weight:700}.ready a{color:#FFD9D2}
footer{padding:24px 0 110px;color:var(--mut);font-size:13.5px;border-top:1px solid rgba(16,32,31,.1)}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink)}
@media (max-width:900px){.sg,.tt,.mg,.gb{grid-template-columns:1fr}.qg{grid-template-columns:1fr}}
@media (max-width:620px){:root{--pad:18px}.hb .btn{display:none}form{grid-template-columns:1fr}.lab{max-width:44vw}.lab b{font-size:36px}.lab span{font-size:14px}.lab{bottom:120px}.knob{width:56px;height:56px;margin:-28px 0 0 -28px}}
</style>

/* shared plumbing: languages, photos, WhatsApp form, header state. The design lives in each page. */
document.documentElement.classList.add("js");
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var lang = "en";
function setLang(l){
  lang = T[l] ? l : "en"; var d = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=d[el.dataset.t]; if(v!=null) el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(function(el){var v=d[el.dataset.th]; if(v!=null) el.innerHTML=v;});
  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=d[el.dataset.ph]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.lang===lang?"true":"false");});
  document.querySelectorAll(".ph .fb").forEach(function(f){var s=f.parentElement.dataset.label; if(s&&d[s]) f.textContent=d[s];});
  if(window.onLang) onLang(d);
  document.title = d.title;
  try{localStorage.setItem(SLUG+"-lang",lang);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang);});});

/* accordion helper for each page's own question markup */
function qa(box, items, cls){
  var open=[].map.call(box.querySelectorAll("button[aria-expanded]"),function(b){return b.getAttribute("aria-expanded")==="true";});
  box.innerHTML="";
  items.forEach(function(q,i){
    var id=box.id+"-a"+i, o=!!open[i];
    var wrap=document.createElement("div"); wrap.className=cls||"q";
    wrap.innerHTML='<button type="button" aria-expanded="'+o+'" aria-controls="'+id+'"><span class="qt"></span><i aria-hidden="true"></i></button><div class="qa-a" id="'+id+'"><div><p></p></div></div>';
    wrap.querySelector(".qt").textContent=q[0]; wrap.querySelector("p").textContent=q[1];
    wrap.querySelector("button").addEventListener("click",function(){this.setAttribute("aria-expanded",this.getAttribute("aria-expanded")==="true"?"false":"true");});
    box.appendChild(wrap);
  });
}

/* photographs from Wikimedia Commons; a named placeholder stays if none loads */
var used=[];
function credit(n){if(used.indexOf(n)>-1)return; used.push(n); var cl=document.getElementById("cl"); if(!cl)return; var a=document.createElement("a"); a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(n); a.target="_blank"; a.rel="noopener"; a.textContent=used.length; if(cl.childNodes.length)cl.appendChild(document.createTextNode(" ")); cl.appendChild(a); var c=document.getElementById("credits"); if(c)c.hidden=false;}
function loadPhoto(el, list){
  list = (list || el.dataset.photo || "").split("|").filter(Boolean);
  el.querySelectorAll("img,.fb").forEach(function(x){x.remove();});
  if(getComputedStyle(el).position==="static") el.style.position="relative";
  var fb=document.createElement("span"); fb.className="fb"; var s=el.dataset.label; if(s&&T[lang][s]) fb.textContent=T[lang][s]; el.appendChild(fb);
  var img=new Image(); img.alt=""; img.decoding="async"; if(!el.dataset.eager) img.loading="lazy";
  var w=el.dataset.w||1000;
  img.onload=function(){if(img.naturalWidth>50){img.classList.add("ok"); fb.remove(); credit(img.dataset.n);}};
  img.onerror=function(){var n=list.shift(); if(n){img.dataset.n=n; img.src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(n)+"?width="+w;} else img.remove();};
  el.appendChild(img); img.onerror();
}

/* WhatsApp form: every field with data-m becomes a line of the message */
function wireForm(){
  document.querySelectorAll("[data-wa]").forEach(function(a){a.href="https://wa.me/"+PHONE;});
  document.querySelectorAll("[data-tg]").forEach(function(a){a.href="https://t.me/"+TG;});
  var f=document.getElementById("form"); if(!f) return;
  f.addEventListener("submit",function(e){
    e.preventDefault(); var d=T[lang], n=document.getElementById("n"), box=n.closest("[data-field]");
    if(!n.value.trim()){box.classList.add("bad"); n.focus(); return;} box.classList.remove("bad");
    var lines=[d.hello];
    f.querySelectorAll("[data-m]").forEach(function(x){var v=x.tagName==="SELECT"?x.options[x.selectedIndex].textContent:x.value.trim(); if(v) lines.push((d[x.dataset.m]||"")+": "+v);});
    var a=document.getElementById("wa"); a.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(lines.join("\n"));
    document.getElementById("ready").classList.add("show"); a.focus();
  });
  document.querySelectorAll("[data-pick]").forEach(function(a){a.addEventListener("click",function(){var s=document.getElementById("r"); if(s) s.value=a.dataset.pick;});});
}

/* header turns solid after the first screen; the phone bar shows between hero and form */
function wireChrome(){
  var hd=document.querySelector("header"), hero=document.querySelector("[data-hero]"), mbar=document.querySelector(".mbar"), form=document.getElementById("form");
  var tick=false;
  function f(){tick=false; var hb=hero?hero.getBoundingClientRect().bottom:0;
    if(hd) hd.classList.toggle("solid", hb<80);
    if(mbar&&form){var r=form.getBoundingClientRect(); mbar.classList.toggle("on", hb<0 && !(r.top<innerHeight&&r.bottom>0));}
    if(window.onScroll) onScroll();}
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(f);}},{passive:true});
  addEventListener("resize",f); f();
}
function progress(el){var r=el.getBoundingClientRect(); return Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight)));}
function reveal(sel){var els=document.querySelectorAll(sel); if(RM||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"}); els.forEach(function(e){io.observe(e);});}

function boot(){
  var l=null; try{l=localStorage.getItem(SLUG+"-lang");}catch(e){}
  if(!l){var n=(navigator.language||"en").toLowerCase(); l=n.indexOf("ru")===0?"ru":n.indexOf("tg")===0?"tg":"en";}
  setLang(l);
  document.querySelectorAll(".ph[data-photo]").forEach(function(el){loadPhoto(el);});
  wireForm(); wireChrome();
}

/* hero comparison: drag, keys, and a one-time nudge */
var hero=document.getElementById("top"), knob=document.getElementById("knob"), X=50, dragging=false;
function setX(v){X=Math.max(8,Math.min(92,v)); hero.style.setProperty("--x",X+"%"); knob.setAttribute("aria-valuenow",Math.round(X));}
function fromEv(e){var r=hero.getBoundingClientRect(); setX((e.clientX-r.left)/r.width*100);}
hero.addEventListener("pointerdown",function(e){if(e.target.closest("a,header"))return; dragging=true; hero.classList.add("drag"); hero.setPointerCapture(e.pointerId); fromEv(e);});
hero.addEventListener("pointermove",function(e){if(dragging)fromEv(e);});
["pointerup","pointercancel"].forEach(function(t){hero.addEventListener(t,function(){dragging=false; hero.classList.remove("drag");});});
knob.addEventListener("keydown",function(e){if(e.key==="ArrowLeft"){setX(X-5);e.preventDefault();} if(e.key==="ArrowRight"){setX(X+5);e.preventDefault();}});
if(!RM){var t0=null; function nudge(t){if(!t0)t0=t; var k=(t-t0)/1400; if(k>1||dragging){return;} setX(50+Math.sin(k*Math.PI*2)*12*(1-k)); requestAnimationFrame(nudge);} setTimeout(function(){requestAnimationFrame(nudge);},900);}
setX(50);
/* trip type buttons feed the message */
var mv=document.getElementById("mv"), modeV="foot";
document.querySelectorAll(".mode button").forEach(function(b){b.addEventListener("click",function(){modeV=b.dataset.v; document.querySelectorAll(".mode button").forEach(function(x){x.setAttribute("aria-pressed",x===b);}); mv.value=T[lang][modeV];});});
document.querySelectorAll('[data-pick="foot"],[data-pick="car"]').forEach(function(a){a.addEventListener("click",function(){var b=document.querySelector('.mode button[data-v="'+a.dataset.pick+'"]'); if(b)b.click();});});
function li(arr){return arr.map(function(x){return "<li><b>"+x[0]+"</b><span>"+x[1]+"</span></li>";}).join("");}
function onLang(d){document.getElementById("la").innerHTML=li(d.la); document.getElementById("lb").innerHTML=li(d.lb); mv.value=d[modeV]; knob.setAttribute("aria-label",d.aria); qa(document.getElementById("qs"), d.qs, "q");}
boot();
</script>
