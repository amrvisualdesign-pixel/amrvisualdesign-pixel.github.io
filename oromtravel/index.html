<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:4px}
button{font:inherit;color:inherit}
.skip{position:absolute;left:-9999px}.skip:focus{left:14px;top:12px;z-index:99;background:#111;color:#fff;padding:10px 14px}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s cubic-bezier(.23,1,.32,1)}
.ph img.ok{opacity:1}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.23,1,.32,1)}
.qa-a>div{overflow:hidden}
button[aria-expanded="true"]+.qa-a{grid-template-rows:1fr}
.ready{display:none}.ready.show{display:block}
[data-field] .err{display:none}[data-field].bad .err{display:block}
.mbar{display:none}
@media (max-width:620px){.mbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:45;transform:translateY(150%);transition:transform .35s cubic-bezier(.23,1,.32,1)}.mbar.on{transform:none}.mbar>*{flex:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

:root{--paper:#F6F0E6;--ink:#231A1C;--mut:#6E6062;--wine:#7A1F2E;--wine-2:#5E1522;--rule:#D9CDBE;--s:'Playfair Display',Georgia,serif;--b:'Raleway',system-ui,sans-serif;--e:cubic-bezier(.23,1,.32,1);--pad:28px}
body{background:var(--paper);color:var(--ink);font:400 18px/1.65 var(--b)}
::selection{background:var(--wine);color:var(--paper)}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
.w{max-width:1200px;margin:0 auto;padding:0 var(--pad)}
header{position:fixed;inset:0 0 auto;z-index:40;transition:background .3s var(--e)}
header.solid{background:var(--paper);box-shadow:0 1px 0 var(--rule)}
.hb{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font:700 24px var(--s);text-decoration:none;letter-spacing:.01em}
.logo i{font-style:italic;font-weight:500;color:var(--wine)}
.r{display:flex;align-items:center;gap:6px}
.lang button{background:none;border:0;cursor:pointer;font:600 13px var(--b);letter-spacing:.06em;padding:10px 7px;min-height:44px;color:var(--mut)}
.lang button[aria-pressed="true"]{color:var(--wine)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;background:var(--wine);color:var(--paper);font:600 15px var(--b);letter-spacing:.04em;text-decoration:none;border:0;cursor:pointer;transition:transform .16s var(--e),background .2s}
.btn:hover{background:var(--wine-2)}.btn:active{transform:scale(.97)}
/* cover */
.cover{padding:96px 0 0}
.mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:12px;font:600 13px var(--b);letter-spacing:.14em;text-transform:uppercase;gap:12px;flex-wrap:wrap}
.cover h1{font:500 clamp(54px,10vw,150px)/.92 var(--s);letter-spacing:-.025em;margin-top:26px}
.cover h1 em{color:var(--wine)}
.cg{display:grid;grid-template-columns:2fr 1fr;gap:clamp(24px,4vw,50px);margin-top:36px;align-items:end}
.cover .ph{aspect-ratio:16/9}
.cover .ph .fb,.feat .ph .fb{font:500 italic 30px var(--s);color:rgba(35,26,28,.22);background:#E8DDCD}
.cover .cap{font-size:15px;color:var(--mut);border-top:1px solid var(--rule);padding-top:14px}
.cover .cap p+p{margin-top:12px}
.cover .cap .btn{margin-top:18px}
/* editorial: word reveal */
.essay{padding:clamp(100px,15vh,170px) 0}
.essay .k{font:600 13px var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--wine)}
.words{font:500 clamp(30px,4.2vw,58px)/1.22 var(--s);letter-spacing:-.01em;max-width:24ch}
.words span{color:rgba(35,26,28,.14);transition:color .35s var(--e)}
.words span.on{color:var(--ink)}
.words span.em.on{color:var(--wine);font-style:italic}
.byline{margin-top:30px;font-size:15px;color:var(--mut)}
/* features */
.feat{border-top:2px solid var(--ink);padding:56px 0 clamp(90px,13vh,150px)}
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(20px,3vw,40px)}
.story .ph{aspect-ratio:4/5}
.story:nth-child(2){margin-top:80px}
.story .ph{transition:transform .6s var(--e)}
.story .kk{display:block;font:600 12.5px var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--wine);margin-top:16px}
.story h3{font:600 28px/1.12 var(--s);margin-top:6px}
.story p{color:var(--mut);margin-top:8px;font-size:16.5px}
.story a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:var(--ink);margin-top:6px}
@media (hover:hover) and (pointer:fine){.story:hover .ph{transform:translateY(-6px)}}
/* compare */
.cmp{background:var(--wine);color:var(--paper);padding:clamp(90px,13vh,150px) 0}
.cmp h2,.qa h2,.wr h2{font:500 clamp(38px,5vw,70px)/1.02 var(--s);letter-spacing:-.02em}
.cmp h2 em{font-style:italic}
.sw{display:inline-flex;margin-top:34px;border:1px solid rgba(246,240,230,.5);border-radius:999px;padding:4px;position:relative}
.sw button{position:relative;z-index:1;background:none;border:0;color:var(--paper);font:600 15px var(--b);padding:0 24px;min-height:46px;cursor:pointer;transition:color .3s}
.sw button[aria-pressed="true"]{color:var(--wine)}
.sw .kn{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:var(--paper);transition:transform .45s var(--e),width .45s var(--e)}
.ct{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px;border-top:1px solid rgba(246,240,230,.35)}
.ct div{padding:22px 22px 0 0;min-width:0;overflow-wrap:anywhere}
.ct dt{font:600 12.5px var(--b);letter-spacing:.14em;text-transform:uppercase;color:#E6C9CC}
.ct dd{font:500 clamp(22px,2.4vw,30px)/1.2 var(--s);margin-top:10px;transition:opacity .25s,filter .25s}
.ct.out dd{opacity:0;filter:blur(4px)}
.cmp .note{margin-top:30px;color:#E6C9CC;max-width:60ch;font-size:16px}
/* qa */
.qa{padding:clamp(90px,13vh,150px) 0}
.qg{display:grid;grid-template-columns:1fr 1.7fr;gap:clamp(30px,6vw,90px)}
.q{border-bottom:1px solid var(--rule)}.q:first-child{border-top:2px solid var(--ink)}
.q button{width:100%;display:flex;gap:18px;justify-content:space-between;align-items:center;background:none;border:0;text-align:left;padding:22px 0;min-height:44px;cursor:pointer;font:600 22px/1.3 var(--s);color:var(--ink)}
.q i{flex:none;font:500 italic 28px/1 var(--s);color:var(--wine);transition:transform .35s var(--e)}
.q i::before{content:"+"}
.q button[aria-expanded="true"] i{transform:rotate(45deg)}
.q p{padding:0 0 22px;color:var(--mut);max-width:62ch}
/* letter */
.wr{padding:0 0 clamp(90px,13vh,150px)}
.lt{background:#FFFDF8;border:1px solid var(--rule);padding:clamp(26px,5vw,64px);display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(28px,5vw,70px)}
.lt .lead{color:var(--mut);margin-top:14px}
.lt .ch{display:flex;gap:18px;margin-top:22px;font-weight:600;flex-wrap:wrap}
.lt .ch a{color:var(--wine)}
form{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
[data-field]{display:flex;flex-direction:column;gap:4px}
[data-field].full{grid-column:1/-1}
label{font:600 12.5px var(--b);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
input,select,textarea{font:400 18px var(--b);background:transparent;border:0;border-bottom:1px solid var(--ink);color:var(--ink);padding:10px 0;min-height:48px;width:100%;border-radius:0}
input:focus,select:focus,textarea:focus{outline:none;border-bottom:2px solid var(--wine)}
textarea{min-height:90px;resize:vertical}
.err{color:#B3261E;font-size:13px}
.fine{grid-column:1/-1;font-size:13px;color:var(--mut)}
.ready{grid-column:1/-1;font-weight:700}.ready a{color:var(--wine)}
footer{border-top:2px solid var(--ink);padding:24px 0 110px;color:var(--mut);font-size:13.5px}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink)}
@media (max-width:900px){.cg,.qg,.lt{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}.story:nth-child(2){margin-top:0}.ct{grid-template-columns:1fr 1fr}}
@media (max-width:620px){:root{--pad:18px}.hb .btn{display:none}.fg{grid-template-columns:1fr}form{grid-template-columns:1fr}.cover h1{font-size:54px}.sw{display:flex;width:100%}.sw button{flex:1;padding:0 6px;font-size:14px}.ct{grid-template-columns:1fr}.ct div{padding-right:0}}

/* shared plumbing: languages, photos, WhatsApp form, header state. The design lives in each page. */
document.documentElement.classList.add("js");
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var lang = "en";
function setLang(l){
  lang = T[l] ? l : "en"; var d = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=d[el.dataset.t]; if(v!=null) el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(function(el){var v=d[el.dataset.th]; if(v!=null) el.innerHTML=v;});
  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=d[el.dataset.ph]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.lang===lang?"true":"false");});
  document.querySelectorAll(".ph .fb").forEach(function(f){var s=f.parentElement.dataset.label; if(s&&d[s]) f.textContent=d[s];});
  if(window.onLang) onLang(d);
  document.title = d.title;
  try{localStorage.setItem(SLUG+"-lang",lang);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang);});});

/* accordion helper for each page's own question markup */
function qa(box, items, cls){
  var open=[].map.call(box.querySelectorAll("button[aria-expanded]"),function(b){return b.getAttribute("aria-expanded")==="true";});
  box.innerHTML="";
  items.forEach(function(q,i){
    var id=box.id+"-a"+i, o=!!open[i];
    var wrap=document.createElement("div"); wrap.className=cls||"q";
    wrap.innerHTML='<button type="button" aria-expanded="'+o+'" aria-controls="'+id+'"><span class="qt"></span><i aria-hidden="true"></i></button><div class="qa-a" id="'+id+'"><div><p></p></div></div>';
    wrap.querySelector(".qt").textContent=q[0]; wrap.querySelector("p").textContent=q[1];
    wrap.querySelector("button").addEventListener("click",function(){this.setAttribute("aria-expanded",this.getAttribute("aria-expanded")==="true"?"false":"true");});
    box.appendChild(wrap);
  });
}

/* photographs from Wikimedia Commons; a named placeholder stays if none loads */
var used=[];
function credit(n){if(used.indexOf(n)>-1)return; used.push(n); var cl=document.getElementById("cl"); if(!cl)return; var a=document.createElement("a"); a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(n); a.target="_blank"; a.rel="noopener"; a.textContent=used.length; if(cl.childNodes.length)cl.appendChild(document.createTextNode(" ")); cl.appendChild(a); var c=document.getElementById("credits"); if(c)c.hidden=false;}
function loadPhoto(el, list){
  list = (list || el.dataset.photo || "").split("|").filter(Boolean);
  el.querySelectorAll("img,.fb").forEach(function(x){x.remove();});
  if(getComputedStyle(el).position==="static") el.style.position="relative";
  var fb=document.createElement("span"); fb.className="fb"; var s=el.dataset.label; if(s&&T[lang][s]) fb.textContent=T[lang][s]; el.appendChild(fb);
  var img=new Image(); img.alt=""; img.decoding="async"; if(!el.dataset.eager) img.loading="lazy";
  var w=el.dataset.w||1000;
  img.onload=function(){if(img.naturalWidth>50){img.classList.add("ok"); fb.remove(); credit(img.dataset.n);}};
  img.onerror=function(){var n=list.shift(); if(n){img.dataset.n=n; img.src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(n)+"?width="+w;} else img.remove();};
  el.appendChild(img); img.onerror();
}

/* WhatsApp form: every field with data-m becomes a line of the message */
function wireForm(){
  document.querySelectorAll("[data-wa]").forEach(function(a){a.href="https://wa.me/"+PHONE;});
  document.querySelectorAll("[data-tg]").forEach(function(a){a.href="https://t.me/"+TG;});
  var f=document.getElementById("form"); if(!f) return;
  f.addEventListener("submit",function(e){
    e.preventDefault(); var d=T[lang], n=document.getElementById("n"), box=n.closest("[data-field]");
    if(!n.value.trim()){box.classList.add("bad"); n.focus(); return;} box.classList.remove("bad");
    var lines=[d.hello];
    f.querySelectorAll("[data-m]").forEach(function(x){var v=x.tagName==="SELECT"?x.options[x.selectedIndex].textContent:x.value.trim(); if(v) lines.push((d[x.dataset.m]||"")+": "+v);});
    var a=document.getElementById("wa"); a.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(lines.join("\n"));
    document.getElementById("ready").classList.add("show"); a.focus();
  });
  document.querySelectorAll("[data-pick]").forEach(function(a){a.addEventListener("click",function(){var s=document.getElementById("r"); if(s) s.value=a.dataset.pick;});});
}

/* header turns solid after the first screen; the phone bar shows between hero and form */
function wireChrome(){
  var hd=document.querySelector("header"), hero=document.querySelector("[data-hero]"), mbar=document.querySelector(".mbar"), form=document.getElementById("form");
  var tick=false;
  function f(){tick=false; var hb=hero?hero.getBoundingClientRect().bottom:0;
    if(hd) hd.classList.toggle("solid", hb<80);
    if(mbar&&form){var r=form.getBoundingClientRect(); mbar.classList.toggle("on", hb<0 && !(r.top<innerHeight&&r.bottom>0));}
    if(window.onScroll) onScroll();}
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(f);}},{passive:true});
  addEventListener("resize",f); f();
}
function progress(el){var r=el.getBoundingClientRect(); return Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight)));}
function reveal(sel){var els=document.querySelectorAll(sel); if(RM||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"}); els.forEach(function(e){io.observe(e);});}

function boot(){
  var l=null; try{l=localStorage.getItem(SLUG+"-lang");}catch(e){}
  if(!l){var n=(navigator.language||"en").toLowerCase(); l=n.indexOf("ru")===0?"ru":n.indexOf("tg")===0?"tg":"en";}
  setLang(l);
  document.querySelectorAll(".ph[data-photo]").forEach(function(el){loadPhoto(el);});
  wireForm(); wireChrome();
}

var words=document.getElementById("words"), ct=document.getElementById("ct"), kn=document.getElementById("kn"), sw=document.querySelectorAll(".sw button"), mode="g", WS=[];
function renderCt(){ct.innerHTML=T[lang].ct[mode].map(function(r){return "<div><dt>"+r[0]+"</dt><dd>"+r[1]+"</dd></div>";}).join("");}
function placeKn(){var b=document.querySelector('.sw button[data-k="'+mode+'"]'); kn.style.width=b.offsetWidth+"px"; kn.style.transform="translateX("+(b.offsetLeft-4)+"px)";}
sw.forEach(function(b){b.addEventListener("click",function(){if(b.dataset.k===mode)return; mode=b.dataset.k; sw.forEach(function(x){x.setAttribute("aria-pressed",x===b);}); placeKn();
  if(RM){renderCt();return;} ct.classList.add("out"); setTimeout(function(){renderCt(); ct.classList.remove("out");},230);});});
function onLang(d){
  var on=false; words.innerHTML=d.essay.split(" ").map(function(w){var em=w.indexOf("*")>-1; w=w.replace(/\*/g,""); return '<span'+(em?' class="em"':'')+'>'+w+'</span>';}).join(" ");
  WS=[].slice.call(words.children); renderCt(); requestAnimationFrame(placeKn); qa(document.getElementById("qs"), d.qs, "q"); onScroll();
}
function onScroll(){
  if(!WS.length)return; var r=words.getBoundingClientRect(), vh=innerHeight;
  var p=RM?1:Math.max(0,Math.min(1,(vh*0.85-r.top)/(r.height+vh*0.35)));
  var n=Math.round(p*WS.length); WS.forEach(function(s,i){s.classList.toggle("on",i<n);});
}
addEventListener("resize",placeKn);
boot();
</script>
