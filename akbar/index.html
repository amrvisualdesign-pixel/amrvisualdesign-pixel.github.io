<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

a{color:inherit;text-underline-offset:4px}
button{font:inherit;color:inherit}
.skip{position:absolute;left:-9999px}.skip:focus{left:14px;top:12px;z-index:99;background:#111;color:#fff;padding:10px 14px}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s cubic-bezier(.23,1,.32,1)}
.ph img.ok{opacity:1}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.23,1,.32,1)}
.qa-a>div{overflow:hidden}
button[aria-expanded="true"]+.qa-a{grid-template-rows:1fr}
.ready{display:none}.ready.show{display:block}
[data-field] .err{display:none}[data-field].bad .err{display:block}
.mbar{display:none}

:root{--teal:#0E3B3C;--teal-2:#14524F;--sand:#EFE7DA;--sand-2:#E3D7C3;--sun:#E59A2F;--ink:#13201F;--mut:#4E5B58;--d:'Unbounded',system-ui,sans-serif;--b:'Inter',system-ui,sans-serif;--e:cubic-bezier(.23,1,.32,1);--pad:28px}
body{background:var(--sand);color:var(--ink);font:400 17px/1.65 var(--b)}
::selection{background:var(--sun);color:var(--teal)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.w{max-width:1200px;margin:0 auto;padding:0 var(--pad)}
header{position:fixed;top:0;left:0;right:0;z-index:40;color:#fff;transition:background .3s var(--e),color .3s}
header.solid{background:var(--sand);color:var(--ink);box-shadow:0 1px 0 var(--sand-2)}
.hb{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font:800 22px var(--d);text-decoration:none;letter-spacing:-.02em}
.r{display:flex;align-items:center;gap:8px}
.lang button{background:none;border:0;cursor:pointer;font:600 13px var(--b);padding:10px 7px;min-height:44px;opacity:.55}
.lang button[aria-pressed="true"]{opacity:1}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--sun);color:var(--teal);font:700 15px var(--b);text-decoration:none;border:0;cursor:pointer;transition:transform .16s var(--e),background .2s}
.pill:hover{background:#F2AE4B}.pill:active{transform:scale(.97)}
/* hero: two halves, city and mountains */
.hero{position:relative;height:100svh;min-height:640px;display:grid;grid-template-columns:1fr 1fr;background:var(--teal)}
.hero .ph{height:100%}
.hero .ph .fb{font:700 clamp(22px,3vw,40px) var(--d);color:rgba(255,255,255,.22);background:var(--teal-2)}
.hero .ph:first-child .fb{background:#3D4A48}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,30,30,.25),rgba(9,30,30,.15) 45%,rgba(9,30,30,.78))}
.hero .copy{position:absolute;left:0;right:0;bottom:0;z-index:2;color:#fff;padding-bottom:clamp(36px,7vh,80px)}
.hero h1{font:800 clamp(44px,8.4vw,124px)/.92 var(--d);letter-spacing:-.04em}
.hero h1 span{display:block}
.hero h1 span:last-child{color:var(--sun)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:26px;flex-wrap:wrap}
.hero p{max-width:44ch;color:rgba(255,255,255,.9)}
.seam{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--sun);z-index:1;transform:scaleY(0);transform-origin:top;animation:seam 1.4s .2s var(--e) forwards}
@keyframes seam{to{transform:scaleY(1)}}
/* the day: city wipes into mountains */
.day{height:300vh;position:relative;background:#0A2B2C;color:#fff}
.day .st{position:sticky;top:0;height:100svh;overflow:hidden}
.day .ph{position:absolute;inset:0}
.day .ph .fb{font:700 clamp(28px,4vw,56px) var(--d);color:rgba(255,255,255,.18)}
.day .city .fb{background:#3D4A48}.day .mount .fb{background:var(--teal-2)}
.day .mount{clip-path:inset(100% 0 0 0)}
.day .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.day .cap{position:absolute;left:0;right:0;bottom:clamp(40px,10vh,110px);z-index:2}
.day .cap div{position:absolute;bottom:0;left:var(--pad);right:var(--pad);transition:opacity .5s var(--e),transform .5s var(--e)}
.day .cap b{display:block;font:800 clamp(34px,5.6vw,80px)/.95 var(--d);letter-spacing:-.03em}
.day .cap span{display:block;margin-top:12px;max-width:46ch;color:rgba(255,255,255,.88)}
.day .cap .two{opacity:0;transform:translateY(20px)}
.day.flip .cap .one{opacity:0;transform:translateY(-20px)}
.day.flip .cap .two{opacity:1;transform:none}
.bar{position:absolute;left:var(--pad);right:var(--pad);top:96px;height:3px;background:rgba(255,255,255,.2);z-index:2}
.bar i{display:block;height:100%;background:var(--sun);transform-origin:0;transform:scaleX(0)}
/* about */
.about{padding:clamp(90px,13vh,150px) 0}
.ag{display:grid;grid-template-columns:5fr 6fr;gap:clamp(36px,6vw,90px);align-items:center}
.about .ph{aspect-ratio:4/5;border-radius:28px}
.about .ph .fb{font:700 28px var(--d);color:rgba(14,59,60,.25);background:var(--sand-2)}
.about h2{font:800 clamp(34px,4.4vw,60px)/1 var(--d);letter-spacing:-.03em;color:var(--teal)}
.about p{margin-top:20px;color:var(--mut);max-width:58ch}
.tongues{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.tongues span{font:700 14px var(--d);padding:12px 18px;border-radius:999px;background:var(--teal);color:var(--sand)}
/* tours as a picker */
.pick{background:var(--teal);color:var(--sand);padding:clamp(90px,13vh,150px) 0}
.pick h2{font:800 clamp(34px,4.4vw,60px)/1 var(--d);letter-spacing:-.03em}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:34px 0 30px}
.tabs button{border:1px solid rgba(239,231,218,.35);background:none;border-radius:999px;padding:12px 20px;min-height:46px;cursor:pointer;font:600 15px var(--b);color:var(--sand);transition:background .2s,color .2s,transform .16s var(--e)}
.tabs button:active{transform:scale(.97)}
.tabs button[aria-selected="true"]{background:var(--sun);border-color:var(--sun);color:var(--teal)}
.panel{display:grid;grid-template-columns:7fr 5fr;gap:clamp(28px,5vw,70px);align-items:center}
.panel .ph{aspect-ratio:16/11;border-radius:22px}
.panel .ph .fb{font:700 30px var(--d);color:rgba(239,231,218,.25);background:var(--teal-2)}
.panel .len{font:700 14px var(--b);color:var(--sun);letter-spacing:.04em}
.panel h3{font:800 clamp(28px,3.2vw,44px)/1.02 var(--d);margin-top:8px;letter-spacing:-.02em}
.panel p{margin-top:14px;color:rgba(239,231,218,.85);max-width:44ch}
.panel .pill{margin-top:24px}
.swap{transition:opacity .25s var(--e),filter .25s var(--e)}
.swap.out{opacity:0;filter:blur(4px)}
/* questions */
.faq{padding:clamp(90px,13vh,150px) 0}
.faq h2{font:800 clamp(34px,4.4vw,60px)/1 var(--d);letter-spacing:-.03em;color:var(--teal);max-width:16ch}
#qs{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.q{background:#F7F1E6;border-radius:22px;padding:4px 24px}
.q button{width:100%;display:flex;justify-content:space-between;gap:16px;align-items:center;background:none;border:0;text-align:left;padding:20px 0;min-height:44px;cursor:pointer;font:600 17px/1.35 var(--b)}
.q i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--teal);position:relative;transition:transform .3s var(--e)}
.q i::before,.q i::after{content:"";position:absolute;left:10px;right:10px;top:15px;height:2px;background:var(--sand)}
.q i::after{transform:rotate(90deg)}
.q button[aria-expanded="true"] i{transform:rotate(45deg)}
.q p{padding:0 0 22px;color:var(--mut)}
/* contact */
.go{padding:0 0 clamp(80px,12vh,140px)}
.gocard{background:var(--sun);border-radius:36px;padding:clamp(28px,5vw,70px);display:grid;grid-template-columns:5fr 6fr;gap:clamp(28px,5vw,70px);color:var(--teal)}
.gocard h2{font:800 clamp(34px,4.6vw,64px)/.98 var(--d);letter-spacing:-.03em}
.gocard .lead{margin-top:16px;font-weight:500}
.gocard .ch{margin-top:26px;display:flex;gap:18px;flex-wrap:wrap;font-weight:700}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
[data-field]{display:flex;flex-direction:column;gap:6px}
[data-field].full{grid-column:1/-1}
label{font:700 13px var(--b)}
input,select,textarea{font:400 16px var(--b);border:0;border-radius:14px;padding:14px 16px;min-height:52px;background:#FBF4E8;color:var(--ink);width:100%}
textarea{min-height:96px;resize:vertical}
.err{color:#7A1D12;font-size:13px;font-weight:700}
.send{justify-self:start;background:var(--teal);color:var(--sand)}
.send:hover{background:var(--teal-2)}
.fine{grid-column:1/-1;font-size:13px}
.ready{grid-column:1/-1;font-weight:700}
footer{padding:28px 0 110px;font-size:13.5px;color:var(--mut);border-top:1px solid var(--sand-2)}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:900px){.ag,.panel,.gocard{grid-template-columns:1fr}#qs{grid-template-columns:1fr}}
@media (max-width:620px){:root{--pad:20px}.hero{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.seam{left:0;right:0;top:50%;bottom:auto;width:auto;height:2px;transform:scaleX(0);transform-origin:left}@keyframes seam{to{transform:scaleX(1)}}.hero h1{font-size:44px}.pill span.t{display:none}form{grid-template-columns:1fr}.hb .pill{padding:0 14px}}
</style>
</head>

/* shared plumbing: languages, photos, WhatsApp form, header state. The design lives in each page. */
document.documentElement.classList.add("js");
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var lang = "en";
function setLang(l){
  lang = T[l] ? l : "en"; var d = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=d[el.dataset.t]; if(v!=null) el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(function(el){var v=d[el.dataset.th]; if(v!=null) el.innerHTML=v;});
  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=d[el.dataset.ph]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.lang===lang?"true":"false");});
  document.querySelectorAll(".ph .fb").forEach(function(f){var s=f.parentElement.dataset.label; if(s&&d[s]) f.textContent=d[s];});
  if(window.onLang) onLang(d);
  document.title = d.title;
  try{localStorage.setItem(SLUG+"-lang",lang);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang);});});

/* accordion helper for each page's own question markup */
function qa(box, items, cls){
  var open=[].map.call(box.querySelectorAll("button[aria-expanded]"),function(b){return b.getAttribute("aria-expanded")==="true";});
  box.innerHTML="";
  items.forEach(function(q,i){
    var id=box.id+"-a"+i, o=!!open[i];
    var wrap=document.createElement("div"); wrap.className=cls||"q";
    wrap.innerHTML='<button type="button" aria-expanded="'+o+'" aria-controls="'+id+'"><span class="qt"></span><i aria-hidden="true"></i></button><div class="qa-a" id="'+id+'"><div><p></p></div></div>';
    wrap.querySelector(".qt").textContent=q[0]; wrap.querySelector("p").textContent=q[1];
    wrap.querySelector("button").addEventListener("click",function(){this.setAttribute("aria-expanded",this.getAttribute("aria-expanded")==="true"?"false":"true");});
    box.appendChild(wrap);
  });
}

/* photographs from Wikimedia Commons; a named placeholder stays if none loads */
var used=[];
function credit(n){if(used.indexOf(n)>-1)return; used.push(n); var cl=document.getElementById("cl"); if(!cl)return; var a=document.createElement("a"); a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(n); a.target="_blank"; a.rel="noopener"; a.textContent=used.length; if(cl.childNodes.length)cl.appendChild(document.createTextNode(" ")); cl.appendChild(a); var c=document.getElementById("credits"); if(c)c.hidden=false;}
function loadPhoto(el, list){
  list = (list || el.dataset.photo || "").split("|").filter(Boolean);
  el.querySelectorAll("img,.fb").forEach(function(x){x.remove();});
  if(getComputedStyle(el).position==="static") el.style.position="relative";
  var fb=document.createElement("span"); fb.className="fb"; var s=el.dataset.label; if(s&&T[lang][s]) fb.textContent=T[lang][s]; el.appendChild(fb);
  var img=new Image(); img.alt=""; img.decoding="async"; if(!el.dataset.eager) img.loading="lazy";
  var w=el.dataset.w||1000;
  img.onload=function(){if(img.naturalWidth>50){img.classList.add("ok"); fb.remove(); credit(img.dataset.n);}};
  img.onerror=function(){var n=list.shift(); if(n){img.dataset.n=n; img.src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(n)+"?width="+w;} else img.remove();};
  el.appendChild(img); img.onerror();
}

/* WhatsApp form: every field with data-m becomes a line of the message */
function wireForm(){
  document.querySelectorAll("[data-wa]").forEach(function(a){a.href="https://wa.me/"+PHONE;});
  document.querySelectorAll("[data-tg]").forEach(function(a){a.href="https://t.me/"+TG;});
  var f=document.getElementById("form"); if(!f) return;
  f.addEventListener("submit",function(e){
    e.preventDefault(); var d=T[lang], n=document.getElementById("n"), box=n.closest("[data-field]");
    if(!n.value.trim()){box.classList.add("bad"); n.focus(); return;} box.classList.remove("bad");
    var lines=[d.hello];
    f.querySelectorAll("[data-m]").forEach(function(x){var v=x.tagName==="SELECT"?x.options[x.selectedIndex].textContent:x.value.trim(); if(v) lines.push((d[x.dataset.m]||"")+": "+v);});
    var a=document.getElementById("wa"); a.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(lines.join("\n"));
    document.getElementById("ready").classList.add("show"); a.focus();
  });
  document.querySelectorAll("[data-pick]").forEach(function(a){a.addEventListener("click",function(){var s=document.getElementById("r"); if(s) s.value=a.dataset.pick;});});
}

/* header turns solid after the first screen; the phone bar shows between hero and form */
function wireChrome(){
  var hd=document.querySelector("header"), hero=document.querySelector("[data-hero]"), mbar=document.querySelector(".mbar"), form=document.getElementById("form");
  var tick=false;
  function f(){tick=false; var hb=hero?hero.getBoundingClientRect().bottom:0;
    if(hd) hd.classList.toggle("solid", hb<80);
    if(mbar&&form){var r=form.getBoundingClientRect(); mbar.classList.toggle("on", hb<0 && !(r.top<innerHeight&&r.bottom>0));}
    if(window.onScroll) onScroll();}
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(f);}},{passive:true});
  addEventListener("resize",f); f();
}
function progress(el){var r=el.getBoundingClientRect(); return Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight)));}
function reveal(sel){var els=document.querySelectorAll(sel); if(RM||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"}); els.forEach(function(e){io.observe(e);});}

function boot(){
  var l=null; try{l=localStorage.getItem(SLUG+"-lang");}catch(e){}
  if(!l){var n=(navigator.language||"en").toLowerCase(); l=n.indexOf("ru")===0?"ru":n.indexOf("tg")===0?"tg":"en";}
  setLang(l);
  document.querySelectorAll(".ph[data-photo]").forEach(function(el){loadPhoto(el);});
  wireForm(); wireChrome();
}

var cur=0, tabs=document.getElementById("tabs"), sel=document.getElementById("r");
function showTour(i,anim){
  cur=i; var d=T[lang], k=TOURS[i][0], p=document.getElementById("panel");
  [].forEach.call(tabs.children,function(b,j){b.setAttribute("aria-selected",j===i?"true":"false");});
  function fill(){document.getElementById("plen").textContent=d[k+"l"]; document.getElementById("pname").textContent=d[k]; document.getElementById("pdesc").textContent=d[k+"p"]; var ph=document.getElementById("pph"); ph.dataset.label=k; loadPhoto(ph,TOURS[i][1]); document.getElementById("pask").dataset.pick=k; p.classList.remove("out");}
  if(anim&&!RM){p.classList.add("out"); setTimeout(fill,200);} else fill();
}
function onLang(d){
  tabs.innerHTML=""; sel.innerHTML="";
  TOURS.forEach(function(t,i){var b=document.createElement("button"); b.type="button"; b.setAttribute("role","tab"); b.textContent=d[t[0]]; b.addEventListener("click",function(){showTour(i,true);}); tabs.appendChild(b);
    var o=document.createElement("option"); o.value=t[0]; o.textContent=d[t[0]]; sel.appendChild(o);});
  showTour(cur,false); qa(document.getElementById("qs"), d.qs, "q");
}
var day=document.getElementById("day"), mount=document.getElementById("mount"), bar=document.getElementById("bar");
function onScroll(){var p=RM?1:progress(day); var k=Math.min(1,Math.max(0,(p-0.15)/0.6)); mount.style.clipPath="inset("+((1-k)*100).toFixed(2)+"% 0 0 0)"; bar.style.transform="scaleX("+p.toFixed(3)+")"; day.classList.toggle("flip",k>0.5);}
document.getElementById("pask").addEventListener("click",function(){sel.value=this.dataset.pick;});
boot();
</script>
