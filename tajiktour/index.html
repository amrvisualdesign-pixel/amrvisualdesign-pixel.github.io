<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:4px}
button{font:inherit;color:inherit}
.skip{position:absolute;left:-9999px}.skip:focus{left:14px;top:12px;z-index:99;background:#111;color:#fff;padding:10px 14px}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s cubic-bezier(.23,1,.32,1)}
.ph img.ok{opacity:1}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.23,1,.32,1)}
.qa-a>div{overflow:hidden}
button[aria-expanded="true"]+.qa-a{grid-template-rows:1fr}
.ready{display:none}.ready.show{display:block}
[data-field] .err{display:none}[data-field].bad .err{display:block}
.mbar{display:none}
@media (max-width:620px){.mbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:45;transform:translateY(150%);transition:transform .35s cubic-bezier(.23,1,.32,1)}.mbar.on{transform:none}.mbar>*{flex:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

:root{--bg:#F4F1EA;--card:#FFFFFF;--ink:#16202A;--mut:#5A6570;--green:#1E7A4F;--green-2:#165E3C;--red:#C8372D;--line:#DCD6C9;--s:'Roboto Slab',Georgia,serif;--b:'Roboto',system-ui,sans-serif;--e:cubic-bezier(.23,1,.32,1);--pad:28px}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--b)}
::selection{background:var(--green);color:#fff}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.w{max-width:1180px;margin:0 auto;padding:0 var(--pad)}
header{position:fixed;inset:0 0 auto;z-index:40;transition:background .3s var(--e)}
header.solid{background:var(--bg);box-shadow:0 1px 0 var(--line)}
.hb{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font:700 22px var(--s);text-decoration:none;display:flex;align-items:center;gap:10px}
.logo b{width:28px;height:28px;border-radius:7px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:15px}
.r{display:flex;align-items:center;gap:6px}
.lang button{background:none;border:0;cursor:pointer;font:700 13px var(--b);padding:10px 7px;min-height:44px;color:var(--mut)}
.lang button[aria-pressed="true"]{color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:10px;background:var(--green);color:#fff;font:700 15px var(--b);text-decoration:none;border:0;cursor:pointer;transition:transform .16s var(--e),background .2s}
.btn:hover{background:var(--green-2)}.btn:active{transform:scale(.97)}
.btn.ln{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
/* hero */
.hero{padding:118px 0 80px}
.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(30px,5vw,70px);align-items:center}
.hero h1{font:700 clamp(42px,5.6vw,80px)/1.02 var(--s);letter-spacing:-.02em}
.hero h1 span{color:var(--green)}
.hero p{color:var(--mut);margin-top:20px;max-width:46ch}
.hero .acts{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.addr{display:flex;gap:12px;align-items:flex-start;margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:15.5px;color:var(--mut);max-width:46ch}
.addr svg{flex:none;margin-top:3px;color:var(--red)}
.hero .ph{aspect-ratio:1;border-radius:24px}
.hero .ph .fb,.svc .ph .fb{font:600 24px var(--s);color:rgba(22,32,42,.22);background:#E5DFD2}
/* the checklist */
.list{height:420vh;position:relative}
.list .st{position:sticky;top:0;height:100svh;display:flex;align-items:center}
.lg{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(30px,5vw,80px);align-items:center;width:100%}
.list h2{font:700 clamp(34px,4.4vw,60px)/1.05 var(--s);letter-spacing:-.015em}
.list .sub{color:var(--mut);margin-top:16px;max-width:40ch}
.count{font:700 clamp(60px,8vw,110px)/1 var(--s);color:var(--green);margin-top:24px;font-variant-numeric:tabular-nums}
.count small{font:500 18px var(--b);color:var(--mut);margin-left:10px}
.sheet{background:var(--card);border-radius:20px;padding:clamp(18px,3vw,34px);box-shadow:0 1px 2px rgba(22,32,42,.06),0 30px 60px -30px rgba(22,32,42,.28);position:relative}
.sheet::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:24px;transform:translateX(-50%);background:#C9C1B0;border-radius:6px}
.sheet h3{font:600 15px var(--b);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding-bottom:14px;border-bottom:1px solid var(--line)}
.it{display:grid;grid-template-columns:34px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:start}
.it:last-child{border-bottom:0}
.box{width:30px;height:30px;border-radius:8px;border:2px solid #B9B2A3;display:grid;place-items:center;transition:background .3s var(--e),border-color .3s}
.box svg{width:18px;height:18px}
.box path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--e) .1s}
.it.on .box{background:var(--green);border-color:var(--green)}
.it.on .box path{stroke-dashoffset:0}
.it b{display:block;font:600 21px/1.25 var(--s);transition:color .3s}
.it span{display:block;color:var(--mut);font-size:16px;margin-top:4px}
.it:not(.on) b{color:#8A8F95}
/* services detail */
.svc{padding:clamp(90px,13vh,140px) 0;background:var(--card)}
.svc h2,.qa h2,.vis h2{font:700 clamp(34px,4.4vw,60px)/1.05 var(--s);letter-spacing:-.015em}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.tour .ph{aspect-ratio:4/3;border-radius:16px}
.tour h3{font:600 24px/1.15 var(--s);margin-top:16px}
.tour p{color:var(--mut);margin-top:6px;font-size:16.5px}
.tour a{display:inline-flex;align-items:center;min-height:44px;color:var(--green);font-weight:700;margin-top:4px}
/* qa */
.qa{padding:clamp(90px,13vh,140px) 0}
.qg{display:grid;grid-template-columns:1fr 1.6fr;gap:clamp(30px,6vw,90px)}
.q{background:var(--card);border-radius:14px;margin-bottom:10px;padding:0 22px}
.q button{width:100%;display:flex;justify-content:space-between;gap:18px;align-items:center;background:none;border:0;text-align:left;padding:20px 0;min-height:44px;cursor:pointer;font:600 19px/1.3 var(--s);color:var(--ink)}
.q i{flex:none;width:12px;height:12px;border-right:2.5px solid var(--green);border-bottom:2.5px solid var(--green);transform:rotate(45deg) translate(-3px,-3px);transition:transform .3s var(--e)}
.q button[aria-expanded="true"] i{transform:rotate(225deg)}
.q p{padding:0 0 20px;color:var(--mut);max-width:62ch}
/* visit */
.vis{padding:0 0 clamp(90px,13vh,140px)}
.vg{display:grid;grid-template-columns:1fr 1.25fr;gap:20px}
.map{border-radius:20px;background:#E9E4D8;position:relative;overflow:hidden;min-height:420px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end}
.map svg.streets{position:absolute;inset:0;width:100%;height:100%}
.map svg.streets path{fill:none;stroke:#fff;stroke-linecap:round}
.pin{position:absolute;left:58%;top:40%;transform:translate(-50%,-100%);color:var(--red)}
.pin::after{content:"";position:absolute;left:50%;bottom:-6px;width:18px;height:6px;margin-left:-9px;border-radius:50%;background:rgba(0,0,0,.18)}
.map .lbl{position:relative;background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 10px 30px -14px rgba(22,32,42,.3)}
.map .lbl b{font:600 19px var(--s)}
.map .lbl span{display:block;color:var(--mut);font-size:15px;margin-top:4px}
.fm{background:var(--card);border-radius:20px;padding:clamp(22px,3.4vw,40px)}
.fm .lead{color:var(--mut);margin-top:10px}
.fm .ch{display:flex;gap:18px;margin:16px 0 22px;font-weight:700;flex-wrap:wrap}
.fm .ch a{color:var(--green)}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
[data-field]{display:flex;flex-direction:column;gap:6px}
[data-field].full{grid-column:1/-1}
label{font:500 14px var(--b);color:var(--mut)}
input,select,textarea{font:400 17px var(--b);background:var(--bg);border:1.5px solid transparent;color:var(--ink);padding:12px 14px;min-height:50px;width:100%;border-radius:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);background:#fff}
textarea{min-height:96px;resize:vertical}
.chk{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:0 16px;min-height:44px;color:var(--ink);font-size:15px;cursor:pointer}
.chk input{width:18px;height:18px;min-height:0;accent-color:var(--green)}
.err{color:var(--red);font-size:13px}
.fine{grid-column:1/-1;font-size:13px;color:var(--mut)}
.ready{grid-column:1/-1;font-weight:700}.ready a{color:var(--green)}
body.inlist .mbar{opacity:0!important;pointer-events:none}
footer{border-top:1px solid var(--line);padding:24px 0 110px;color:var(--mut);font-size:13.5px}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink)}
@media (max-width:900px){.hg,.lg,.qg,.vg{grid-template-columns:1fr}.sg{grid-template-columns:1fr 1fr}.hero .ph{aspect-ratio:16/10}.list .st{align-items:flex-start;padding-top:84px}.count{display:none}.list .sub{display:none}.lg{gap:20px}}
@media (max-width:620px){:root{--pad:18px}.hb .btn{display:none}.sg{grid-template-columns:1fr}form{grid-template-columns:1fr}.it{padding:12px 0}.it b{font-size:18px}.it span{font-size:14.5px}.map{min-height:340px}}
</style>
</head>

</div></section>

<section class="list" id="list"><div class="st"><div class="w lg">

    <article class="tour"><div class="ph" data-photo="Hissar_fortress_gate.jpg|Hisor_Fortress.jpg" data-label="t3"></div><h3 data-t="t3"></h3><p data-t="t3p"></p><a href="#vis" data-pick="t3" data-t="ask"></a></article>
  </div>
</div></section>

<section class="qa"><div class="w qg"><h2 data-t="qa_h"></h2><div id="qs"></div></div></section>

<section class="vis" id="vis"><div class="w">
  <div class="vg">
    <div class="map" aria-hidden="true">
      <svg class="streets" viewBox="0 0 400 420" preserveAspectRatio="xMidYMid slice"><path d="M-10,120 L420,170" stroke-width="18"/><path d="M230,-10 L215,430" stroke-width="22"/><path d="M-10,300 L420,260" stroke-width="10"/><path d="M80,-10 L120,430" stroke-width="8"/><path d="M330,-10 L360,430" stroke-width="8"/><rect x="240" y="180" width="80" height="60" rx="8" fill="#D8D0BE"/></svg>
      <svg class="pin" width="34" height="44" viewBox="0 0 18 22"><path fill="currentColor" d="M9 0a9 9 0 0 0-9 9c0 6.6 9 13 9 13s9-6.4 9-13a9 9 0 0 0-9-9Zm0 12.5A3.5 3.5 0 1 1 9 5.5a3.5 3.5 0 0 1 0 7Z"/></svg>
      <div class="lbl"><b data-t="of_h"></b><span data-t="addr"></span></div>
    </div>
    <div class="fm">
      <h2 data-t="vs_h"></h2><p class="lead" data-t="vs_p"></p>
      <div class="ch"><a data-wa href="#">WhatsApp</a><a data-tg href="#">Telegram</a></div>
      <form id="form" novalidate>
        <div data-field><label for="n" data-t="l_n"></label><input id="n" data-m="m_n" autocomplete="name"><span class="err" data-t="e_n"></span></div>
        <div data-field><label for="d" data-t="l_d"></label><input id="d" data-m="m_d" data-ph="ph_d"></div>
        <div class="chk" id="need"></div><input type="hidden" id="needv" data-m="m_need">
        <div data-field class="full"><label for="m" data-t="l_m"></label><textarea id="m" data-m="m_m" data-ph="ph_m"></textarea></div>
        <button class="btn" type="submit" data-t="send"></button>
        <p class="fine" data-t="fine"></p>
        <p class="ready" id="ready" role="status"><span data-t="ready"></span> <a id="wa" href="#" target="_blank" rel="noopener" data-t="open"></a></p>
      </form>
    </div>
  </div>
</div></section>
</main>
<footer><div class="w"><span>Tajik tour · <span data-t="f_l"></span></span><span id="credits" hidden><span data-t="photos"></span> <span id="cl"></span></span></div><div class="w" style="margin-top:8px" data-t="demo"></div></footer>

/* shared plumbing: languages, photos, WhatsApp form, header state. The design lives in each page. */
document.documentElement.classList.add("js");
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var lang = "en";
function setLang(l){
  lang = T[l] ? l : "en"; var d = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=d[el.dataset.t]; if(v!=null) el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(function(el){var v=d[el.dataset.th]; if(v!=null) el.innerHTML=v;});
  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=d[el.dataset.ph]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.lang===lang?"true":"false");});
  document.querySelectorAll(".ph .fb").forEach(function(f){var s=f.parentElement.dataset.label; if(s&&d[s]) f.textContent=d[s];});
  if(window.onLang) onLang(d);
  document.title = d.title;
  try{localStorage.setItem(SLUG+"-lang",lang);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang);});});

/* accordion helper for each page's own question markup */
function qa(box, items, cls){
  var open=[].map.call(box.querySelectorAll("button[aria-expanded]"),function(b){return b.getAttribute("aria-expanded")==="true";});
  box.innerHTML="";
  items.forEach(function(q,i){
    var id=box.id+"-a"+i, o=!!open[i];
    var wrap=document.createElement("div"); wrap.className=cls||"q";
    wrap.innerHTML='<button type="button" aria-expanded="'+o+'" aria-controls="'+id+'"><span class="qt"></span><i aria-hidden="true"></i></button><div class="qa-a" id="'+id+'"><div><p></p></div></div>';
    wrap.querySelector(".qt").textContent=q[0]; wrap.querySelector("p").textContent=q[1];
    wrap.querySelector("button").addEventListener("click",function(){this.setAttribute("aria-expanded",this.getAttribute("aria-expanded")==="true"?"false":"true");});
    box.appendChild(wrap);
  });
}

/* photographs from Wikimedia Commons; a named placeholder stays if none loads */
var used=[];
function credit(n){if(used.indexOf(n)>-1)return; used.push(n); var cl=document.getElementById("cl"); if(!cl)return; var a=document.createElement("a"); a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(n); a.target="_blank"; a.rel="noopener"; a.textContent=used.length; if(cl.childNodes.length)cl.appendChild(document.createTextNode(" ")); cl.appendChild(a); var c=document.getElementById("credits"); if(c)c.hidden=false;}
function loadPhoto(el, list){
  list = (list || el.dataset.photo || "").split("|").filter(Boolean);
  el.querySelectorAll("img,.fb").forEach(function(x){x.remove();});
  if(getComputedStyle(el).position==="static") el.style.position="relative";
  var fb=document.createElement("span"); fb.className="fb"; var s=el.dataset.label; if(s&&T[lang][s]) fb.textContent=T[lang][s]; el.appendChild(fb);
  var img=new Image(); img.alt=""; img.decoding="async"; if(!el.dataset.eager) img.loading="lazy";
  var w=el.dataset.w||1000;
  img.onload=function(){if(img.naturalWidth>50){img.classList.add("ok"); fb.remove(); credit(img.dataset.n);}};
  img.onerror=function(){var n=list.shift(); if(n){img.dataset.n=n; img.src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(n)+"?width="+w;} else img.remove();};
  el.appendChild(img); img.onerror();
}

/* WhatsApp form: every field with data-m becomes a line of the message */
function wireForm(){
  document.querySelectorAll("[data-wa]").forEach(function(a){a.href="https://wa.me/"+PHONE;});
  document.querySelectorAll("[data-tg]").forEach(function(a){a.href="https://t.me/"+TG;});
  var f=document.getElementById("form"); if(!f) return;
  f.addEventListener("submit",function(e){
    e.preventDefault(); var d=T[lang], n=document.getElementById("n"), box=n.closest("[data-field]");
    if(!n.value.trim()){box.classList.add("bad"); n.focus(); return;} box.classList.remove("bad");
    var lines=[d.hello];
    f.querySelectorAll("[data-m]").forEach(function(x){var v=x.tagName==="SELECT"?x.options[x.selectedIndex].textContent:x.value.trim(); if(v) lines.push((d[x.dataset.m]||"")+": "+v);});
    var a=document.getElementById("wa"); a.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(lines.join("\n"));
    document.getElementById("ready").classList.add("show"); a.focus();
  });
  document.querySelectorAll("[data-pick]").forEach(function(a){a.addEventListener("click",function(){var s=document.getElementById("r"); if(s) s.value=a.dataset.pick;});});
}

/* header turns solid after the first screen; the phone bar shows between hero and form */
function wireChrome(){
  var hd=document.querySelector("header"), hero=document.querySelector("[data-hero]"), mbar=document.querySelector(".mbar"), form=document.getElementById("form");
  var tick=false;
  function f(){tick=false; var hb=hero?hero.getBoundingClientRect().bottom:0;
    if(hd) hd.classList.toggle("solid", hb<80);
    if(mbar&&form){var r=form.getBoundingClientRect(); mbar.classList.toggle("on", hb<0 && !(r.top<innerHeight&&r.bottom>0));}
    if(window.onScroll) onScroll();}
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(f);}},{passive:true});
  addEventListener("resize",f); f();
}
function progress(el){var r=el.getBoundingClientRect(); return Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight)));}
function reveal(sel){var els=document.querySelectorAll(sel); if(RM||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"}); els.forEach(function(e){io.observe(e);});}

function boot(){
  var l=null; try{l=localStorage.getItem(SLUG+"-lang");}catch(e){}
  if(!l){var n=(navigator.language||"en").toLowerCase(); l=n.indexOf("ru")===0?"ru":n.indexOf("tg")===0?"tg":"en";}
  setLang(l);
  document.querySelectorAll(".ph[data-photo]").forEach(function(el){loadPhoto(el);});
  wireForm(); wireChrome();
}

var list=document.getElementById("list"), items=document.getElementById("items"), cnt=document.getElementById("cnt"), need=document.getElementById("need"), IT=[];
var TICK='<svg viewBox="0 0 18 18"><path d="M3.5 9.5l3.5 3.5 7.5-8"/></svg>';
function onLang(d){
  items.innerHTML=d.items.map(function(x){return '<div class="it"><div class="box">'+TICK+'</div><div><b>'+x[0]+'</b><span>'+x[1]+'</span></div></div>';}).join("");
  IT=[].slice.call(items.children);
  var was=[].map.call(need.querySelectorAll("input"),function(c){return c.checked;});
  need.innerHTML=d.need.map(function(x,i){return '<label><input type="checkbox" value="'+i+'"'+(was[i]?' checked':'')+'> '+x+'</label>';}).join("");
  qa(document.getElementById("qs"), d.qs, "q"); if(window.syncNeed)syncNeed(); onScroll();
}
function onScroll(){var p=RM?1:progress(list), n=Math.min(IT.length,Math.floor(p*(IT.length+0.6))); IT.forEach(function(x,i){x.classList.toggle("on",i<n);}); cnt.textContent=n; document.body.classList.toggle("inlist",p>0&&p<1);}
/* add ticked needs to the WhatsApp message */
var needv=document.getElementById("needv");
function syncNeed(){var d=T[lang]; needv.value=[].filter.call(need.querySelectorAll("input"),function(c){return c.checked;}).map(function(c){return d.need[+c.value];}).join(", ");}
need.addEventListener("change",syncNeed);
boot();
</script>
