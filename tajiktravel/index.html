<!-- Demo for Tajik Travel Agency (team led by Muhammad). Facts from their public profile; contacts and details to be confirmed. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:4px}
button{font:inherit;color:inherit}
.skip{position:absolute;left:-9999px}.skip:focus{left:14px;top:12px;z-index:99;background:#111;color:#fff;padding:10px 14px}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s cubic-bezier(.23,1,.32,1)}
.ph img.ok{opacity:1}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.23,1,.32,1)}
.qa-a>div{overflow:hidden}
button[aria-expanded="true"]+.qa-a{grid-template-rows:1fr}
.ready{display:none}.ready.show{display:block}
[data-field] .err{display:none}[data-field].bad .err{display:block}
.mbar{display:none}
@media (max-width:620px){.mbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:45;transform:translateY(150%);transition:transform .35s cubic-bezier(.23,1,.32,1)}.mbar.on{transform:none}.mbar>*{flex:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

:root{--bg:#F4EFE6;--card:#FFFDF8;--ink:#1D2A24;--mut:#55625B;--acc:#E0603F;--acc-2:#C44F31;--tone:#C98A3D;--tone-soft:#EADBC2;--f:'Nunito',system-ui,sans-serif;--e:cubic-bezier(.23,1,.32,1);--pad:26px}
body.nature{--bg:#E6F1EA;--tone:#1F7A55;--tone-soft:#C9E3D3}
body{background:var(--bg);color:var(--ink);font:500 17px/1.6 var(--f);transition:background .6s var(--e)}
::selection{background:var(--acc);color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:6px}
.w{max-width:1160px;margin:0 auto;padding:0 var(--pad)}
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);transition:background .6s var(--e)}
.hb{display:flex;align-items:center;justify-content:space-between;height:70px}
.logo{font:900 20px var(--f);text-decoration:none;letter-spacing:-.01em}
.logo i{font-style:normal;color:var(--tone);transition:color .6s}
.r{display:flex;align-items:center;gap:6px}
.lang{display:flex;background:var(--card);border-radius:999px;padding:4px}
.lang button{background:none;border:0;cursor:pointer;font:800 12.5px var(--f);padding:8px 11px;min-height:40px;border-radius:999px;color:var(--mut)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:16px;background:var(--acc);color:#fff;font:800 16px var(--f);text-decoration:none;border:0;cursor:pointer;transition:transform .16s var(--e),background .2s}
.btn:hover{background:var(--acc-2)}.btn:active{transform:scale(.97)}
/* hero */
.hero{padding:clamp(40px,7vh,80px) 0 clamp(50px,8vh,90px);text-align:center}
.hero h1{font:900 clamp(44px,7.4vw,110px)/.95 var(--f);letter-spacing:-.04em}
.hero h1 .or{color:var(--mut);font-weight:700;font-size:.55em;letter-spacing:-.01em;display:inline-block;margin:0 .2em;vertical-align:.2em}
.hero h1 .c{color:#C98A3D}.hero h1 .n{color:#1F7A55}
.hero p{max-width:54ch;margin:22px auto 0;color:var(--mut);font-size:19px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:clamp(36px,6vh,60px)}
.duo .ph{aspect-ratio:5/4;border-radius:32px}
.duo .ph:first-child{border-radius:32px 32px 32px 120px}
.duo .ph:last-child{border-radius:32px 120px 32px 32px}
.duo .ph .fb{font:900 30px var(--f);color:rgba(29,42,36,.22)}
.duo .ph:first-child .fb{background:#EADBC2}.duo .ph:last-child .fb{background:#C9E3D3}
/* the switch */
.pickr{padding:clamp(70px,10vh,120px) 0}
.toggle{display:flex;justify-content:center}
.tg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:999px;padding:6px;width:min(100%,520px);box-shadow:0 12px 30px -16px rgba(0,0,0,.25)}
.tg button{position:relative;z-index:1;border:0;background:none;cursor:pointer;min-height:58px;font:900 19px var(--f);color:var(--mut);transition:color .3s}
.tg button[aria-selected="true"]{color:#fff}
.tg .knob{position:absolute;top:6px;bottom:6px;left:6px;width:calc(50% - 6px);border-radius:999px;background:var(--tone);transition:transform .45s var(--e),background .6s}
body.nature .tg .knob{transform:translateX(100%)}
.lede{text-align:center;max-width:40ch;margin:26px auto 0;color:var(--mut)}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.tour{background:var(--card);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--e),box-shadow .25s}
@media (hover:hover) and (pointer:fine){.tour:hover{transform:translateY(-4px);box-shadow:0 20px 40px -24px rgba(0,0,0,.35)}}
.tour .ph{aspect-ratio:4/3}
.tour .ph .fb{font:900 24px var(--f);color:rgba(29,42,36,.22);background:var(--tone-soft)}
.tour .b{padding:20px 22px 24px;display:flex;flex-direction:column;gap:8px;flex:1}
.tour .len{align-self:flex-start;font:800 13px var(--f);color:var(--tone);background:var(--tone-soft);padding:4px 12px;border-radius:999px;transition:background .6s,color .6s}
.tour h3{font:900 23px/1.15 var(--f);letter-spacing:-.01em}
.tour p{color:var(--mut);font-size:15.5px;flex:1}
.tour a{font:800 15px var(--f);color:var(--acc);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.swap{transition:opacity .25s var(--e),filter .25s var(--e),transform .25s var(--e)}
.swap.out{opacity:0;filter:blur(6px);transform:translateY(8px)}
/* team */
.team{padding:clamp(70px,10vh,120px) 0}
.tbox{background:var(--ink);color:#F1EDE4;border-radius:40px;padding:clamp(30px,5vw,70px);display:grid;grid-template-columns:7fr 5fr;gap:clamp(28px,5vw,70px);align-items:center}
.tbox h2{font:900 clamp(32px,4vw,54px)/1.02 var(--f);letter-spacing:-.03em}
.tbox p{margin-top:16px;color:#C9CFC9}
.tbox .ph{aspect-ratio:1;border-radius:50% 50% 32px 32px}
.tbox .ph .fb{font:900 26px var(--f);color:rgba(255,255,255,.25);background:#2C3B34}
/* questions */
.faq{padding:clamp(70px,10vh,120px) 0}
.faq h2{font:900 clamp(32px,4vw,54px)/1.02 var(--f);letter-spacing:-.03em;text-align:center}
#qs{max-width:820px;margin:40px auto 0;display:flex;flex-direction:column;gap:12px}
.q{background:var(--card);border-radius:22px;padding:0 24px}
.q button{width:100%;display:flex;justify-content:space-between;gap:16px;align-items:center;background:none;border:0;text-align:left;padding:20px 0;min-height:44px;cursor:pointer;font:800 18px/1.35 var(--f)}
.q i{flex:none;width:30px;height:30px;border-radius:10px;background:var(--tone-soft);position:relative;transition:background .6s}
.q i::before{content:"";position:absolute;left:9px;top:8px;width:9px;height:9px;border-right:2.5px solid var(--tone);border-bottom:2.5px solid var(--tone);transform:rotate(45deg);transition:transform .3s var(--e),top .3s}
.q button[aria-expanded="true"] i::before{transform:rotate(225deg);top:12px}
.q p{padding:0 0 22px;color:var(--mut)}
/* chat-style contact */
.chat{padding:clamp(70px,10vh,120px) 0 clamp(90px,12vh,140px)}
.cbox{max-width:760px;margin:0 auto;background:var(--card);border-radius:36px;padding:clamp(22px,4vw,44px);box-shadow:0 30px 60px -40px rgba(0,0,0,.4)}
.cbox h2{font:900 clamp(28px,3.4vw,44px)/1.05 var(--f);letter-spacing:-.02em}
.bub{margin-top:18px;max-width:80%;background:var(--tone-soft);padding:14px 18px;border-radius:22px 22px 22px 6px;font-weight:700;transition:background .6s}
form{margin-top:18px;display:grid;gap:12px}
[data-field]{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
[data-field] label{font:800 13px var(--f);color:var(--mut)}
input,select,textarea{font:600 16px var(--f);border:2px solid #E7E0D3;border-radius:22px 22px 6px 22px;padding:13px 16px;min-height:52px;width:min(100%,520px);background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
.err{color:#B3261E;font-size:13px;font-weight:800}
.fine{font-size:13px;color:var(--mut);text-align:right}
.ready{font-weight:800;text-align:right}.ready a{color:var(--acc)}
.send{justify-self:end}
.ch{display:flex;gap:18px;margin-top:18px;font-weight:800;flex-wrap:wrap}
footer{padding:26px 0 110px;color:var(--mut);font-size:13.5px}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:900px){.list{grid-template-columns:1fr 1fr}.tbox{grid-template-columns:1fr}}
@media (max-width:620px){:root{--pad:18px}.list{grid-template-columns:1fr}.duo{gap:10px}.duo .ph:first-child{border-radius:24px 24px 24px 70px}.duo .ph:last-child{border-radius:24px 70px 24px 24px}.hb .btn{display:none}.hero h1{font-size:46px}.bub{max-width:100%}}
</style>
</head>

/* shared plumbing: languages, photos, WhatsApp form, header state. The design lives in each page. */
document.documentElement.classList.add("js");
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var lang = "en";
function setLang(l){
  lang = T[l] ? l : "en"; var d = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=d[el.dataset.t]; if(v!=null) el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(function(el){var v=d[el.dataset.th]; if(v!=null) el.innerHTML=v;});
  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=d[el.dataset.ph]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.lang===lang?"true":"false");});
  document.querySelectorAll(".ph .fb").forEach(function(f){var s=f.parentElement.dataset.label; if(s&&d[s]) f.textContent=d[s];});
  if(window.onLang) onLang(d);
  document.title = d.title;
  try{localStorage.setItem(SLUG+"-lang",lang);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang);});});

/* accordion helper for each page's own question markup */
function qa(box, items, cls){
  var open=[].map.call(box.querySelectorAll("button[aria-expanded]"),function(b){return b.getAttribute("aria-expanded")==="true";});
  box.innerHTML="";
  items.forEach(function(q,i){
    var id=box.id+"-a"+i, o=!!open[i];
    var wrap=document.createElement("div"); wrap.className=cls||"q";
    wrap.innerHTML='<button type="button" aria-expanded="'+o+'" aria-controls="'+id+'"><span class="qt"></span><i aria-hidden="true"></i></button><div class="qa-a" id="'+id+'"><div><p></p></div></div>';
    wrap.querySelector(".qt").textContent=q[0]; wrap.querySelector("p").textContent=q[1];
    wrap.querySelector("button").addEventListener("click",function(){this.setAttribute("aria-expanded",this.getAttribute("aria-expanded")==="true"?"false":"true");});
    box.appendChild(wrap);
  });
}

/* photographs from Wikimedia Commons; a named placeholder stays if none loads */
var used=[];
function credit(n){if(used.indexOf(n)>-1)return; used.push(n); var cl=document.getElementById("cl"); if(!cl)return; var a=document.createElement("a"); a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(n); a.target="_blank"; a.rel="noopener"; a.textContent=used.length; if(cl.childNodes.length)cl.appendChild(document.createTextNode(" ")); cl.appendChild(a); var c=document.getElementById("credits"); if(c)c.hidden=false;}
function loadPhoto(el, list){
  list = (list || el.dataset.photo || "").split("|").filter(Boolean);
  el.querySelectorAll("img,.fb").forEach(function(x){x.remove();});
  if(getComputedStyle(el).position==="static") el.style.position="relative";
  var fb=document.createElement("span"); fb.className="fb"; var s=el.dataset.label; if(s&&T[lang][s]) fb.textContent=T[lang][s]; el.appendChild(fb);
  var img=new Image(); img.alt=""; img.decoding="async"; if(!el.dataset.eager) img.loading="lazy";
  var w=el.dataset.w||1000;
  img.onload=function(){if(img.naturalWidth>50){img.classList.add("ok"); fb.remove(); credit(img.dataset.n);}};
  img.onerror=function(){var n=list.shift(); if(n){img.dataset.n=n; img.src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(n)+"?width="+w;} else img.remove();};
  el.appendChild(img); img.onerror();
}

/* WhatsApp form: every field with data-m becomes a line of the message */
function wireForm(){
  document.querySelectorAll("[data-wa]").forEach(function(a){a.href="https://wa.me/"+PHONE;});
  document.querySelectorAll("[data-tg]").forEach(function(a){a.href="https://t.me/"+TG;});
  var f=document.getElementById("form"); if(!f) return;
  f.addEventListener("submit",function(e){
    e.preventDefault(); var d=T[lang], n=document.getElementById("n"), box=n.closest("[data-field]");
    if(!n.value.trim()){box.classList.add("bad"); n.focus(); return;} box.classList.remove("bad");
    var lines=[d.hello];
    f.querySelectorAll("[data-m]").forEach(function(x){var v=x.tagName==="SELECT"?x.options[x.selectedIndex].textContent:x.value.trim(); if(v) lines.push((d[x.dataset.m]||"")+": "+v);});
    var a=document.getElementById("wa"); a.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(lines.join("\n"));
    document.getElementById("ready").classList.add("show"); a.focus();
  });
  document.querySelectorAll("[data-pick]").forEach(function(a){a.addEventListener("click",function(){var s=document.getElementById("r"); if(s) s.value=a.dataset.pick;});});
}

/* header turns solid after the first screen; the phone bar shows between hero and form */
function wireChrome(){
  var hd=document.querySelector("header"), hero=document.querySelector("[data-hero]"), mbar=document.querySelector(".mbar"), form=document.getElementById("form");
  var tick=false;
  function f(){tick=false; var hb=hero?hero.getBoundingClientRect().bottom:0;
    if(hd) hd.classList.toggle("solid", hb<80);
    if(mbar&&form){var r=form.getBoundingClientRect(); mbar.classList.toggle("on", hb<0 && !(r.top<innerHeight&&r.bottom>0));}
    if(window.onScroll) onScroll();}
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(f);}},{passive:true});
  addEventListener("resize",f); f();
}
function progress(el){var r=el.getBoundingClientRect(); return Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight)));}
function reveal(sel){var els=document.querySelectorAll(sel); if(RM||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"}); els.forEach(function(e){io.observe(e);});}

function boot(){
  var l=null; try{l=localStorage.getItem(SLUG+"-lang");}catch(e){}
  if(!l){var n=(navigator.language||"en").toLowerCase(); l=n.indexOf("ru")===0?"ru":n.indexOf("tg")===0?"tg":"en";}
  setLang(l);
  document.querySelectorAll(".ph[data-photo]").forEach(function(el){loadPhoto(el);});
  wireForm(); wireChrome();
}

var mode="city";
function fillList(){
  var d=T[lang], list=document.getElementById("list"), sel=document.getElementById("r");
  document.getElementById("lede").textContent=mode==="city"?d.l_city:d.l_nat;
  list.innerHTML="";
  SETS[mode].forEach(function(t){var a=document.createElement("article"); a.className="tour";
    a.innerHTML='<div class="ph" data-label="'+t[0]+'"></div><div class="b"><span class="len"></span><h3></h3><p></p><a href="#chat"></a></div>';
    a.querySelector(".len").textContent=d[t[0]+"l"]; a.querySelector("h3").textContent=d[t[0]]; a.querySelector("p").textContent=d[t[0]+"p"];
    var link=a.querySelector("a"); link.textContent=d.ask+" →"; link.dataset.pick=t[0]; link.addEventListener("click",function(){sel.value=t[0];});
    list.appendChild(a); loadPhoto(a.querySelector(".ph"),t[1]);});
  sel.innerHTML=""; ["city","nature"].forEach(function(m){SETS[m].forEach(function(t){var o=document.createElement("option"); o.value=t[0]; o.textContent=d[t[0]]; sel.appendChild(o);});});
}
function setMode(m,anim){
  mode=m; document.body.classList.toggle("nature",m==="nature");
  document.querySelectorAll(".tg button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.m2===m?"true":"false");});
  var els=[document.getElementById("list"),document.getElementById("lede")];
  if(anim&&!RM){els.forEach(function(e){e.classList.add("out");}); setTimeout(function(){fillList(); els.forEach(function(e){e.classList.remove("out");});},230);} else fillList();
}
document.querySelectorAll(".tg button").forEach(function(b){b.addEventListener("click",function(){setMode(b.dataset.m2,true);});});
function onLang(d){ fillList(); qa(document.getElementById("qs"), d.qs, "q"); }
boot();
</script>
