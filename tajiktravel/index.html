<!DOCTYPE html>
<html lang="en" data-header="bar" data-hero="split" data-tours="grid" data-facts="strip" data-land="grad" data-how="timeline" data-faq="cards" data-contact="center" data-foot="simple" data-mq="yes" data-grad="no" data-theme="light" data-btn="soft" data-order="C">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tajik Travel Agency · Trips across Tajikistan with an experienced local team</title>
<meta name="description" content="Tajik Travel Agency creates trips across Tajikistan for travelers from all over the world. Our guides show you the main sights of Dushanbe and the natural corners of the country.">
<meta property="og:title" content="Tajik Travel Agency · Trips across Tajikistan with an experienced local team">
<meta property="og:description" content="Tajik Travel Agency creates trips across Tajikistan for travelers from all over the world. Our guides show you the main sights of Dushanbe and the natural corners of the country.">
<meta name="theme-color" content="#10201A">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<!-- Demo for Tajik Travel Agency. Facts come from the company's own public profiles; durations and contacts are to be confirmed. -->
<style>
:root{
  --bg:#F4F7F2; --surface:#FFFFFF; --ink:#18261F; --muted:#5C666B; --line:#E4DCCF; --deep:#10201A; --field:#FCFBF8;
  --g1:#0E8A64; --g2:#0C7C9C; --g3:#9BD34B; --g4:#F2B33D;
  --fh:'PT Serif',system-ui,sans-serif; --fb:'PT Sans',system-ui,sans-serif;
  --r:16px; --r-sm:12px; --wrap:1200px; --pad:24px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6;overflow-x:hidden}
img,svg,canvas{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,.brand,.fact b,.stat b,.giant{font-family:var(--fh)}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:200}
.skip:focus{left:16px}
:focus-visible{outline:3px solid var(--g2);outline-offset:3px;border-radius:6px}
.grad-text{background:linear-gradient(100deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.progress{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));z-index:120;pointer-events:none}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.01em;min-width:0}
.brand .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{flex:none;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}
nav ul{display:flex;gap:26px;list-style:none}
nav a{text-decoration:none;font-weight:600;font-size:15px;color:var(--muted);background:linear-gradient(var(--g1),var(--g1)) 0 100%/0 2px no-repeat;transition:background-size .25s var(--ease),color .2s}
nav a:hover{color:var(--ink);background-size:100% 2px}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;padding:7px 11px;min-height:36px;border-radius:999px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;cursor:pointer;color:var(--ink);padding:0;place-items:center}
.menu-btn svg{width:22px;height:22px}
.menu-btn .i-close{display:none}
.menu-btn[aria-expanded="true"] .i-open{display:none}
.menu-btn[aria-expanded="true"] .i-close{display:block}
body.lock{overflow:hidden}

/* glass header: floats over the hero */
[data-header="glass"] header{position:fixed;top:12px;left:12px;right:12px;max-width:1120px;margin:0 auto;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;transition:background .3s,border-color .3s,box-shadow .3s}
[data-header="glass"] header::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);z-index:-1;transition:background .3s}
[data-header="glass"] .bar{height:60px;padding:0 10px 0 14px}
[data-header="glass"] header:not(.scrolled):not(.menu-open) .brand,[data-header="glass"] header:not(.scrolled):not(.menu-open) nav a{color:#fff}
[data-header="glass"] header:not(.scrolled):not(.menu-open) .lang{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
[data-header="glass"] header:not(.scrolled):not(.menu-open) .lang button{color:rgba(255,255,255,.85)}
[data-header="glass"] header:not(.scrolled):not(.menu-open) .lang button[aria-pressed="true"]{background:#fff;color:#111}
[data-header="glass"] header.scrolled{border-color:var(--line);box-shadow:0 10px 30px rgba(0,0,0,.10)}
[data-header="glass"] header.scrolled::before{background:color-mix(in srgb,var(--bg) 82%,transparent)}
[data-header="glass"] .wrap.bar{max-width:none}
/* minimal header: logo, language and a menu button on every screen */
[data-header="minimal"] nav{display:none}
[data-header="minimal"] .menu-btn{display:grid}
[data-header="minimal"] header{border-bottom:0;background:color-mix(in srgb,var(--bg) 90%,transparent)}

/* full-screen menu */
nav.open{display:block!important;position:fixed;top:0;left:0;right:0;bottom:0;z-index:49;padding:110px var(--pad) 40px;overflow-y:auto;background:var(--bg)}
nav.open::before{content:"";position:absolute;inset:0;background:radial-gradient(700px circle at 100% 0,color-mix(in srgb,var(--g1) 28%,transparent),transparent 60%),radial-gradient(600px circle at 0 100%,color-mix(in srgb,var(--g3) 26%,transparent),transparent 60%);pointer-events:none}
nav.open ul{position:relative;flex-direction:column;gap:0;max-width:720px;margin:0 auto}
nav.open li{border-bottom:1px solid var(--line)}
nav.open a{font-family:var(--fh);font-size:clamp(24px,5vw,40px);font-weight:700;color:var(--ink)!important;display:flex;justify-content:space-between;align-items:center;padding:16px 0;background:none}
nav.open a::after{content:"→";color:var(--g1)}
header .bar{position:relative;z-index:51}
.brand,.right{position:relative;z-index:52}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:transform .18s var(--ease),box-shadow .25s,background-position .5s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-primary{color:#fff;background:linear-gradient(110deg,var(--g1),var(--g2),var(--g1));background-size:200% 100%;box-shadow:0 10px 26px color-mix(in srgb,var(--g1) 38%,transparent)}
.btn-primary:hover{background-position:100% 0}
.btn-ghost{background:transparent;border-color:currentColor;color:inherit}
.btn-ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wa-ico{width:20px;height:20px;flex:none}
[data-btn="pill"] .btn{border-radius:999px}
[data-btn="pill"]{--r:24px;--r-sm:18px}
[data-btn="square"] .btn{border-radius:4px;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
[data-btn="square"]{--r:6px;--r-sm:6px}
[data-btn="square"] .mark{border-radius:8px}

/* ---------- animated gradient canvas ---------- */
canvas.gfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- hero ---------- */
.hero{position:relative;min-height:calc(100svh - 68px);display:flex;align-items:flex-end;overflow:hidden;color:#fff;isolation:isolate}
[data-header="glass"] .hero{min-height:100svh}
.hero .art{position:absolute;inset:0;z-index:0}
.hero .art svg{width:100%;height:100%}
.hero .hero-gfx{z-index:1;mix-blend-mode:soft-light;opacity:.75}
.hero::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(10,14,18,.30) 0%,rgba(10,14,18,.30) 40%,rgba(10,14,18,.80) 100%)}
.hero .wrap{position:relative;z-index:3;width:100%;padding-bottom:64px}
.kicker{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.hero h1{font-size:clamp(36px,5.6vw,76px);line-height:1.03;font-weight:800;letter-spacing:-.025em;max-width:15ch}
.hero p{font-size:clamp(17px,1.6vw,20px);max-width:56ch;margin:22px 0 32px;opacity:.95}
.hero .actions{display:flex;flex-wrap:wrap;gap:14px}
.hero .kicker,.hero h1,.hero p{text-shadow:0 2px 16px rgba(0,0,0,.35)}
[data-enter] .wrap>*{animation:enter .9s var(--ease) both}
[data-enter] .wrap>*:nth-child(2){animation-delay:.08s}
[data-enter] .wrap>*:nth-child(3){animation-delay:.16s}
[data-enter] .wrap>*:nth-child(4){animation-delay:.24s}
@keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* hero: living gradient with the photo in an arch (the shape of a Tajik iwan) */
[data-hero="arch"] .hero{align-items:center}
[data-hero="arch"] .hero .hero-gfx{mix-blend-mode:normal;opacity:1;z-index:0}
[data-hero="arch"] .hero::after{background:linear-gradient(90deg,rgba(10,14,18,.42),rgba(10,14,18,.06) 70%)}
[data-hero="arch"] .hero .art{position:absolute;inset:auto;z-index:3;right:max(var(--pad),calc((100vw - var(--wrap))/2 + var(--pad)));top:50%;transform:translateY(-44%);width:min(36vw,470px);aspect-ratio:3/4;border-radius:999px 999px 26px 26px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.35);border:6px solid rgba(255,255,255,.6)}
[data-hero="arch"] .hero .wrap{padding-top:120px;padding-bottom:90px}
[data-hero="arch"] .hero h1,[data-hero="arch"] .hero p{max-width:min(54vw,620px)}
/* hero: split */
[data-hero="split"] .hero{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;background:var(--ink)}
[data-hero="split"] .hero::after{display:none}
[data-hero="split"] .hero .art{position:relative;inset:auto;order:2}
[data-hero="split"] .hero .hero-gfx{mix-blend-mode:normal;opacity:1;width:50%;z-index:0}
[data-hero="split"] .hero .wrap{order:1;align-self:center;max-width:640px;margin:0 0 0 auto;padding:64px 48px 64px var(--pad)}
[data-hero="split"] .hero h1{font-size:clamp(34px,4.2vw,60px);max-width:16ch}
/* hero: centered */
[data-hero="center"] .hero{align-items:center;text-align:center}
[data-hero="center"] .hero .wrap{display:flex;flex-direction:column;align-items:center;padding:110px var(--pad) 80px}
[data-hero="center"] .hero h1{max-width:20ch;font-size:clamp(34px,5vw,70px)}
[data-hero="center"] .hero p{margin-left:auto;margin-right:auto}
[data-hero="center"] .hero .actions{justify-content:center}
/* hero: framed photo on a gradient field */
[data-hero="framed"] .hero{display:block;min-height:0;padding:22px 0 0;color:#fff}
[data-hero="framed"] .hero .hero-gfx{mix-blend-mode:normal;opacity:1;z-index:0}
[data-hero="framed"] .hero::after{background:rgba(10,14,18,.18)}
[data-hero="framed"] .hero .art{position:relative;inset:auto;z-index:3;height:min(50vh,520px);min-height:320px;max-width:calc(var(--wrap) - 2*var(--pad));margin:0 auto;border-radius:30px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.25)}
[data-header="glass"][data-hero="framed"] .hero{padding-top:90px}
[data-hero="framed"] .hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:12px 48px;align-items:end;padding-top:30px;padding-bottom:40px}
[data-hero="framed"] .hero .kicker{grid-column:1/-1;margin:0}
[data-hero="framed"] .hero h1{font-size:clamp(32px,3.6vw,54px);max-width:none}
[data-hero="framed"] .hero p{margin:0 0 6px}
[data-hero="framed"] .hero .actions{grid-column:1/-1;margin-top:16px}

/* ---------- marquee of places ---------- */
.mq{order:0;overflow:hidden;padding:26px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.mq-track{display:flex;width:max-content;animation:mq 46s linear infinite}
.mq span{font-family:var(--fh);font-size:clamp(28px,4vw,54px);font-weight:800;white-space:nowrap;padding-right:.6em;background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.01em}
@keyframes mq{to{transform:translateX(-50%)}}
[data-mq="no"] .mq{display:none}

/* ---------- sections ---------- */
main{display:flex;flex-direction:column}
main>section{padding:100px 0;scroll-margin-top:72px;order:6;position:relative}
main>.hero{order:0;padding:0}
#faq{order:8}#contact{order:9}
[data-order="A"] #routes{order:1}[data-order="A"] #land{order:2}[data-order="A"] #why{order:3}[data-order="A"] #how{order:4}[data-order="A"] #about{order:5}
[data-order="B"] #why{order:1}[data-order="B"] #land{order:2}[data-order="B"] #routes{order:3}[data-order="B"] #about{order:4}[data-order="B"] #how{order:5}
[data-order="C"] #about{order:1}[data-order="C"] #routes{order:2}[data-order="C"] #land{order:3}[data-order="C"] #why{order:4}[data-order="C"] #how{order:5}
[data-order="D"] #land{order:1}[data-order="D"] #why{order:2}[data-order="D"] #routes{order:3}[data-order="D"] #how{order:4}[data-order="D"] #about{order:5}
.sec-head{max-width:760px;margin-bottom:46px}
h2{font-size:clamp(30px,3.8vw,50px);line-height:1.08;letter-spacing:-.02em;font-weight:800}
[data-grad="yes"] main>section:not(.dark):not(.on-grad) h2{background:linear-gradient(100deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-head p{color:var(--muted);margin-top:14px;font-size:18px}
.aura{background:radial-gradient(640px circle at 0% 0%,color-mix(in srgb,var(--g3) 16%,transparent),transparent 62%),radial-gradient(560px circle at 100% 100%,color-mix(in srgb,var(--g2) 13%,transparent),transparent 62%)}
.dark{background:var(--deep);color:#fff}
.dark .sec-head p{color:#B9C3C6}
.on-grad{color:#fff;overflow:hidden;isolation:isolate}
.on-grad>.wrap{position:relative;z-index:2}
.on-grad .sec-head p,.on-grad .lead{color:rgba(255,255,255,.92)}
.on-grad::after{content:"";position:absolute;inset:0;background:rgba(10,14,18,.22);z-index:1}

/* scroll reveal */
html.js .rv{opacity:0;transform:translateY(30px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
html.js .rv.in{opacity:1;transform:none}

/* ---------- facts ---------- */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;min-width:0;position:relative;overflow:hidden}
.fact::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--g1),var(--g2))}
.fact b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;overflow-wrap:anywhere}
.fact span{color:var(--muted);font-size:15.5px}
[data-facts="strip"] .facts{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
[data-facts="strip"] .fact{background:none;border:0;border-radius:0;border-right:1px solid var(--line);padding:30px 26px}
[data-facts="strip"] .fact::before{display:none}
[data-facts="strip"] .fact b{background:linear-gradient(100deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-facts="strip"] .fact:last-child{border-right:0}
[data-facts="band"] #why{background:var(--deep);color:#fff}
[data-facts="band"] #why h2{color:#fff;background:none}
[data-facts="band"] .fact{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
[data-facts="band"] .fact b{color:#fff}
[data-facts="band"] .fact span{color:#C6D0D3}

/* ---------- Tajikistan in numbers ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.stat{min-width:0}
.stat b{display:block;font-size:clamp(38px,4.6vw,64px);line-height:1;font-weight:800;letter-spacing:-.03em;margin-bottom:12px;white-space:nowrap}
.stat>span{font-size:15.5px;opacity:.9;display:block;max-width:26ch}
[data-land="grad"] #land{color:#fff}
[data-land="light"] #land .stat b{background:linear-gradient(100deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-land="light"] #land .stat{border-top:3px solid var(--g1);padding-top:18px}
[data-land="light"] #land .stat>span{color:var(--muted);opacity:1}

/* ---------- tours ---------- */
.tours{display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.tour{grid-column:span 2;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s;min-width:0}
.tour.wide{grid-column:span 3}
.tour:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(20,30,35,.14)}
.tour .pic{position:relative;aspect-ratio:16/10;overflow:hidden}
.tour .pic svg{width:100%;height:100%;transition:transform .5s var(--ease)}
.tour:hover .pic svg,.tour:hover img.ph{transform:scale(1.04)}
.tour .body{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
.tour .dur{align-self:flex-start;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:linear-gradient(100deg,var(--g1),var(--g2));padding:4px 10px;border-radius:999px}
.tour h3{font-size:22px;line-height:1.2;letter-spacing:-.01em}
.tour p{color:var(--muted);font-size:15.5px;flex:1}
.tour .price{font-size:18px;font-weight:800}
.tour .ask{align-self:flex-start;margin-top:4px;font-weight:700;color:var(--g1);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;background:linear-gradient(currentColor,currentColor) 0 85%/0 2px no-repeat;transition:background-size .25s var(--ease)}
.tour .ask:hover{background-size:100% 2px}
[data-tours="list"] .tours{grid-template-columns:1fr;gap:18px}
[data-tours="list"] .tour,[data-tours="list"] .tour.wide{grid-column:auto;flex-direction:row}
[data-tours="list"] .tour .pic{width:42%;flex:none;aspect-ratio:auto;min-height:260px}
[data-tours="list"] .tour .body{padding:30px 34px;justify-content:center}
[data-tours="list"] .tour h3{font-size:27px}
[data-tours="overlay"] .tour{position:relative;min-height:460px;border:0;color:#fff;justify-content:flex-end;background:#222}
[data-tours="overlay"] .tour .pic{position:absolute;inset:0;aspect-ratio:auto}
[data-tours="overlay"] .tour .pic::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.8) 100%)}
[data-tours="overlay"] .tour .body{position:relative;z-index:2;flex:none}
[data-tours="overlay"] .tour p{color:rgba(255,255,255,.88)}
[data-tours="overlay"] .tour .ask{color:#fff}
/* stack: cards pile up while you scroll */
[data-tours="stack"] .tours{display:block}
[data-tours="stack"] .tour{position:sticky;top:calc(96px + var(--i,0) * 18px);flex-direction:row;min-height:380px;margin-bottom:34px;box-shadow:0 24px 50px rgba(20,30,35,.16)}
[data-tours="stack"] .tour .pic{width:50%;flex:none;aspect-ratio:auto}
[data-tours="stack"] .tour .body{padding:40px;justify-content:center}
[data-tours="stack"] .tour h3{font-size:clamp(26px,3vw,38px)}
[data-tours="stack"] .tour:hover{transform:none}

/* ---------- how it works ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;counter-reset:s}
.step::before{counter-increment:s;content:"0" counter(s);font-family:var(--fh);font-weight:800;letter-spacing:.06em}
.step h3{font-size:24px;margin:12px 0 10px;letter-spacing:-.01em}
[data-how="steps"] #how{background:var(--deep);color:#fff}
[data-how="steps"] #how .sec-head p{color:#B9C3C6}
[data-how="steps"] .step{border-top:2px solid rgba(255,255,255,.18);padding-top:24px}
[data-how="steps"] .step::before{color:var(--g3)}
[data-how="steps"] .step p{color:#C9D1D3}
[data-how="timeline"] .steps{position:relative}
[data-how="timeline"] .steps::before{content:"";position:absolute;left:0;right:0;top:27px;height:4px;border-radius:4px;background:var(--line)}
[data-how="timeline"] .steps::after{content:"";position:absolute;left:0;top:27px;height:4px;border-radius:4px;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3))}
[data-how="timeline"] .step{position:relative;z-index:1}
[data-how="timeline"] .step::before{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:18px;box-shadow:0 0 0 8px var(--bg)}
[data-how="timeline"] .step p{color:var(--muted)}
[data-how="cards"] .step{border-radius:var(--r);padding:34px 30px;color:#fff;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,var(--g1),var(--g2))}
[data-how="cards"] .step:nth-child(2){background:linear-gradient(145deg,var(--g2),var(--g3))}
[data-how="cards"] .step:nth-child(3){background:linear-gradient(145deg,var(--g3),var(--g4))}
[data-how="cards"] .step::before{font-size:64px;line-height:1;opacity:.9;margin-bottom:auto}
[data-how="cards"] .step p{color:rgba(255,255,255,.92)}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:5fr 7fr;gap:56px;align-items:center}
.about .pic{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/5}
.about .pic svg{width:100%;height:100%}
.about p{font-size:18px;margin-top:18px;opacity:.85}
.langs{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.langs span{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}

/* ---------- FAQ ---------- */
.faq-wrap{display:grid;gap:36px}
.faq-side p{color:var(--muted);margin:14px 0 22px;font-size:18px}
.faq-side .btn{display:none}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:22px 44px 22px 0;font-weight:700;font-size:19px;position:relative;min-height:44px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:6px;top:15px;font-size:28px;font-weight:500;color:var(--g1);transition:transform .25s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 0 22px;color:var(--muted);max-width:68ch}
[data-faq="split"] .faq-wrap{grid-template-columns:5fr 7fr;gap:60px;align-items:start}
[data-faq="split"] .faq-side{position:sticky;top:100px}
[data-faq="split"] .faq-side .btn{display:inline-flex}
[data-faq="cards"] .faq{display:grid;grid-template-columns:1fr 1fr;gap:18px}
[data-faq="cards"] details{border:0;background:var(--surface);border-radius:var(--r);padding:6px 26px 6px;position:relative;overflow:hidden;border:1px solid var(--line)}
[data-faq="cards"] details::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--g1),var(--g3))}
[data-faq="cards"] summary{cursor:default;padding-right:0}
[data-faq="cards"] summary::after{display:none}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:5fr 7fr;gap:48px;align-items:start}
.channels{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.channel{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:16px 18px;text-decoration:none;font-weight:700;min-height:56px;transition:transform .2s var(--ease)}
.channel:hover{transform:translateY(-2px)}
.channel small{font-weight:500;color:var(--muted)}
form{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field.full{grid-column:1/-1}
label{font-weight:700;font-size:14px}
input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--field);color:var(--ink);min-height:50px;width:100%}
textarea{min-height:110px;resize:vertical}
.note{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.err{color:#C0362C;font-size:13.5px;font-weight:600;display:none}
.field.bad .err{display:block}
.field.bad input{border-color:#C0362C}
.result{grid-column:1/-1;display:none;background:color-mix(in srgb,var(--g3) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--g3) 40%,transparent);border-radius:10px;padding:16px}
.result.show{display:block}
.result a{font-weight:800;color:var(--g1)}
[data-contact="split"] #contact{background:var(--deep);color:#fff}
[data-contact="split"] #contact .lead{color:#C9D1D3}
[data-contact="center"] #contact .contact{grid-template-columns:1fr;max-width:760px;margin:0 auto;text-align:center}
[data-contact="center"] #contact .channels{flex-direction:row;flex-wrap:wrap;justify-content:center}
[data-contact="center"] #contact .channel{flex:1 1 200px;background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
[data-contact="center"] #contact .channel small{color:rgba(255,255,255,.85)}
[data-contact="center"] #contact form{text-align:left;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lead{margin-top:14px;font-size:18px}

/* ---------- footer ---------- */
footer{position:relative;overflow:hidden;isolation:isolate}
.f-band,.f-giant,.f-cols{display:none}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:14.5px;padding:34px 0}
.foot b{color:var(--ink)}
.demo-line{font-size:13px;color:var(--muted);opacity:.85;padding-bottom:110px}
.credits a{color:inherit}
[data-foot="simple"] footer{border-top:1px solid var(--line)}
[data-foot="giant"] footer{background:var(--deep);color:#fff;padding-top:70px}
[data-foot="giant"] .f-cols{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}
[data-foot="giant"] .f-cols h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:12px}
[data-foot="giant"] .f-cols a,[data-foot="giant"] .f-cols span{display:block;text-decoration:none;opacity:.9;padding:4px 0}
[data-foot="giant"] .f-giant{display:block;font-weight:800;line-height:.85;letter-spacing:-.04em;font-size:clamp(56px,13vw,210px);white-space:nowrap;margin:56px 0 8px;background:linear-gradient(100deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
[data-foot="giant"] .foot,[data-foot="giant"] .foot b{color:rgba(255,255,255,.75)}
[data-foot="giant"] .demo-line{color:rgba(255,255,255,.6)}
[data-foot="band"] .f-band{display:block;position:relative;padding:90px 0;color:#fff;text-align:center}
[data-foot="band"] .f-band .wrap{position:relative;z-index:2}
[data-foot="band"] .f-band h2{color:#fff;font-size:clamp(34px,5vw,64px);margin-bottom:26px;background:none}
[data-foot="band"] .f-band::after{content:"";position:absolute;inset:0;background:rgba(10,14,18,.18);z-index:1}

/* mobile action bar */
.mbar{display:none}

/* ---------- dark theme ---------- */
[data-theme="dark"]{--bg:#0F171A;--surface:#17232A;--line:#26353C;--muted:#9FB0B5;--ink:#ECF1F2;--deep:#081013;--field:#0E161A}
[data-theme="dark"] .mark{color:#fff}

@media (max-width:1024px){
  .facts,.stats{grid-template-columns:repeat(2,1fr)}
  .tour,.tour.wide{grid-column:span 3}
  .about,.contact,[data-faq="split"] .faq-wrap{grid-template-columns:1fr;gap:36px}
  [data-faq="split"] .faq-side{position:static}
  .about .pic{aspect-ratio:16/10;order:-1}
  [data-hero="split"] .hero{grid-template-columns:1fr}
  [data-hero="split"] .hero .art{order:0;height:44vh;min-height:280px}
  [data-hero="split"] .hero .hero-gfx{width:100%;top:44vh;height:auto;bottom:0}
  [data-hero="split"] .hero .wrap{margin:0;max-width:none;padding:40px var(--pad) 48px}
  [data-hero="framed"] .hero .wrap{grid-template-columns:1fr}
  [data-hero="arch"] .hero{flex-direction:column;align-items:stretch}
  [data-hero="arch"] .hero .art{position:relative;right:auto;top:auto;transform:none;width:min(70vw,360px);margin:110px auto 0}
  [data-hero="arch"] .hero .wrap{padding-top:34px}
  [data-hero="arch"] .hero h1,[data-hero="arch"] .hero p{max-width:none}
  [data-foot="giant"] .f-cols{grid-template-columns:1fr 1fr}
  [data-tours="stack"] .tour{flex-direction:column;min-height:0}
  [data-tours="stack"] .tour .pic{width:100%;aspect-ratio:16/10}
  [data-tours="stack"] .tour .body{padding:24px}
}
@media (max-width:820px){
  nav{display:none}
  .menu-btn{display:grid}
  .steps{grid-template-columns:1fr}
  [data-how="timeline"] .steps::before,[data-how="timeline"] .steps::after{left:27px;right:auto;top:0;bottom:0;width:4px;height:auto}
  [data-how="timeline"] .steps::after{height:calc(var(--p,0)*100%);bottom:auto}
  [data-how="timeline"] .step{padding-left:84px}
  [data-how="timeline"] .step::before{position:absolute;left:0;top:0}
  [data-faq="cards"] .faq{grid-template-columns:1fr}
  main>section{padding:76px 0}
}
@media (max-width:620px){
  :root{--pad:18px}
  .tours{grid-template-columns:1fr}
  .tour,.tour.wide{grid-column:auto}
  .facts{grid-template-columns:1fr 1fr;gap:12px}
  .fact{padding:18px}
  .fact b{font-size:19px}
  .stats{gap:26px 16px}
  .stat b{font-size:34px}
  .stat>span{font-size:14px}
  form{grid-template-columns:1fr;padding:20px}
  .hero .actions .btn{width:100%}
  .hero h1{font-size:32px}
  h2{font-size:28px}
  h1,h2,h3{overflow-wrap:break-word;hyphens:auto}
  .lang button{padding:7px 9px}
  .brand .t{display:none}
  [data-header="glass"] header{top:8px;left:8px;right:8px}
  [data-hero="framed"] .hero .art{height:42vh;min-height:250px;margin:0 12px;border-radius:22px}
  [data-tours="list"] .tour,[data-tours="list"] .tour.wide{flex-direction:column}
  [data-tours="list"] .tour .pic{width:100%;min-height:0;aspect-ratio:16/10}
  [data-tours="list"] .tour .body{padding:22px}
  [data-tours="overlay"] .tour{min-height:380px}
  [data-tours="stack"] .tour{top:calc(80px + var(--i,0) * 12px)}
  [data-facts="strip"] .fact{border-right:0;border-bottom:1px solid var(--line);padding:18px 4px}
  [data-facts="strip"] .facts{border-bottom:0}
  [data-foot="giant"] .f-cols{grid-template-columns:1fr}
  .mq{padding:18px 0}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .3s var(--ease)}
  .mbar.on{transform:none}
  .mbar .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  html.js .rv{opacity:1;transform:none}
}
</style>

<body>
<div class="progress" aria-hidden="true"></div>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="Tajik Travel Agency"><span class="mark">T</span><span class="t" data-i18n="brand">Tajik Travel Agency</span></a>
    <nav id="nav" aria-label="Main">
      <ul>
        <li><a href="#routes" data-i18n="nav_routes">Routes</a></li>
        <li><a href="#land" data-i18n="nav_land">Tajikistan</a></li>
        <li><a href="#about" data-i18n="nav_about">About</a></li>
        <li><a href="#faq" data-i18n="nav_faq">FAQ</a></li>
        <li><a href="#contact" data-i18n="nav_contact">Contact</a></li>
      </ul>
    </nav>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button type="button" data-lang="tg" aria-pressed="false">TJ</button>
      </div>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav" aria-label="Menu"><svg class="i-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="i-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" id="top" data-enter>
    <canvas class="gfx hero-gfx" aria-hidden="true"></canvas>
    <div class="art" data-scene="lakes" data-wide="1" aria-hidden="true"></div>
    <div class="wrap">
      <div class="kicker" data-i18n="kicker"></div>
      <h1 data-i18n="h1"></h1>
      <p data-i18n="hero_p"></p>
      <div class="actions">
        <a class="btn btn-primary" href="#contact"><svg class="wa-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg><span data-i18n="btn_plan"></span></a>
        <a class="btn btn-ghost" href="#routes" data-i18n="btn_routes"></a>
      </div>
    </div>
  </section>

  <div class="mq" aria-hidden="true"><div class="mq-track"><span data-i18n="mq"></span><span data-i18n="mq"></span></div></div>

  <section id="why" class="aura" aria-labelledby="why-h">
    <div class="wrap">
      <div class="sec-head rv"><h2 id="why-h" data-i18n="why_h"></h2></div>
      <div class="facts" id="facts"></div>
    </div>
  </section>

  <section id="land" aria-labelledby="land-h">
    <canvas class="gfx land-gfx" aria-hidden="true"></canvas>
    <div class="wrap">
      <div class="sec-head rv"><h2 id="land-h" data-i18n="land_h"></h2><p data-i18n="land_p"></p></div>
      <div class="stats">
        <div class="stat rv"><b><span class="cnt" data-to="90">0</span>%+</b><span data-i18n="l1"></span></div>
        <div class="stat rv"><b><span class="cnt" data-to="7495">0</span><span data-i18n="u_m"></span></b><span data-i18n="l2"></span></div>
        <div class="stat rv"><b><span class="cnt" data-to="77">0</span><span data-i18n="u_km"></span></b><span data-i18n="l3"></span></div>
        <div class="stat rv"><b><span class="cnt" data-to="4655">0</span><span data-i18n="u_m"></span></b><span data-i18n="l4"></span></div>
      </div>
    </div>
  </section>

  <section id="routes" aria-labelledby="routes-h">
    <div class="wrap">
      <div class="sec-head rv"><h2 id="routes-h" data-i18n="routes_h"></h2><p data-i18n="routes_p"></p></div>
      <div class="tours" id="tours"></div>
    </div>
  </section>

  <section id="how" class="aura" aria-labelledby="how-h">
    <div class="wrap">
      <div class="sec-head rv"><h2 id="how-h" data-i18n="how_h"></h2><p data-i18n="how_p"></p></div>
      <div class="steps">
        <div class="step rv"><h3 data-i18n="s1"></h3><p data-i18n="s1p"></p></div>
        <div class="step rv"><h3 data-i18n="s2"></h3><p data-i18n="s2p"></p></div>
        <div class="step rv"><h3 data-i18n="s3"></h3><p data-i18n="s3p"></p></div>
      </div>
    </div>
  </section>

  <section id="about" aria-labelledby="about-h">
    <div class="wrap about">
      <div class="pic rv" data-scene="village" aria-hidden="true"></div>
      <div class="rv">
        <h2 id="about-h" data-i18n="about_h"></h2>
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
        <div class="langs"><span>Русский</span><span>English</span><span>Тоҷикӣ</span></div>
      </div>
    </div>
  </section>

  <section id="faq" class="aura" aria-labelledby="faq-h">
    <div class="wrap faq-wrap">
      <div class="faq-side rv"><h2 id="faq-h" data-i18n="faq_h"></h2><p data-i18n="faq_p"></p><a class="btn btn-primary" href="#contact" data-i18n="mbar"></a></div>
      <div class="faq">
        <details class="rv"><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
        <details class="rv"><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
        <details class="rv"><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
        <details class="rv"><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
      </div>
    </div>
  </section>

  <section id="contact" aria-labelledby="contact-h">
    <canvas class="gfx contact-gfx" aria-hidden="true"></canvas>
    <div class="wrap contact">
      <div class="rv">
        <h2 id="contact-h" data-i18n="contact_h"></h2>
        <p class="lead" data-i18n="contact_p"></p>
        <div class="channels">
          <a class="channel" id="ch-wa" href="#"><span>WhatsApp</span><small>+992 •• ••• •• ••</small></a>
          <a class="channel" id="ch-tg" href="#"><span>Telegram</span><small>@tajiktravel</small></a>
          <a class="channel" id="ch-mail" href="#"><span>Email</span><small>hello@tajiktravel.example</small></a>
        </div>
      </div>
      <form id="trip" novalidate class="rv">
        <div class="field"><label for="f-name" data-i18n="l_name"></label><input id="f-name" name="name" autocomplete="name"><span class="err" data-i18n="e_name"></span></div>
        <div class="field"><label for="f-dates" data-i18n="l_dates"></label><input id="f-dates" name="dates" data-i18n-ph="ph_dates"></div>
        <div class="field"><label for="f-people" data-i18n="l_people"></label><input id="f-people" name="people" type="number" min="1" inputmode="numeric" value="2"></div>
        <div class="field"><label for="f-route" data-i18n="l_route"></label><select id="f-route" name="route"></select></div>
        <div class="field full"><label for="f-msg" data-i18n="l_msg"></label><textarea id="f-msg" name="msg" data-i18n-ph="ph_msg"></textarea></div>
        <div class="field full"><button class="btn btn-primary" type="submit"><span data-i18n="send"></span></button></div>
        <p class="note" data-i18n="note"></p>
        <div class="result" id="result" role="status"><span data-i18n="ready"></span> <a id="wa-link" href="#" target="_blank" rel="noopener" data-i18n="open_wa"></a></div>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="f-band"><canvas class="gfx band-gfx" aria-hidden="true"></canvas><div class="wrap"><h2 data-i18n="band_h"></h2><a class="btn btn-primary" href="#contact" style="background:#fff;color:#111"><span data-i18n="btn_plan"></span></a></div></div>
  <div class="wrap">
    <div class="f-cols">
      <div><b style="font-size:20px" data-i18n="brand"></b><p style="opacity:.75;margin-top:10px;max-width:36ch" data-i18n="kicker"></p></div>
      <div><h4 data-i18n="f_explore"></h4><a href="#routes" data-i18n="nav_routes"></a><a href="#land" data-i18n="nav_land"></a><a href="#about" data-i18n="nav_about"></a><a href="#faq" data-i18n="nav_faq"></a></div>
      <div><h4 data-i18n="f_contact"></h4><a href="#contact">WhatsApp</a><a href="#contact">Telegram</a><a href="#contact">Email</a></div>
      <div><h4 data-i18n="f_lang"></h4><span>Русский</span><span>English</span><span>Тоҷикӣ</span></div>
    </div>
    <div class="f-giant" aria-hidden="true" style="font-size:min(210px, calc(150vw / 19))">Tajik Travel Agency</div>
    <div class="foot"><span><b data-i18n="f_name"></b> · <span data-i18n="f_line"></span></span><span>© 2026</span></div>
    <p class="demo-line credits" id="credits" hidden><span data-i18n="photos"></span> <span id="credit-links"></span></p>
    <p class="demo-line" data-i18n="demo"></p>
  </div>
</footer>

<div class="mbar"><a class="btn btn-primary" href="#contact"><span data-i18n="mbar"></span></a></div>

<script>
document.documentElement.classList.add("js");

/* living gradient: a small WebGL shader in each brand's colours */
(function(){
  var cs=getComputedStyle(document.documentElement);
  function hex(v){v=v.trim().replace("#",""); if(v.length===3)v=v.split("").map(function(c){return c+c;}).join(""); var n=parseInt(v,16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}
  var C=[1,2,3,4].map(function(i){return hex(cs.getPropertyValue("--g"+i)||"#888");});
  var want=[".hero-gfx"]; var H=document.documentElement.dataset;
  if(H.land==="grad") want.push(".land-gfx");
  if(H.contact==="center") want.push(".contact-gfx");
  if(H.foot==="band") want.push(".band-gfx");
  var VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  var FS="precision mediump float;uniform vec2 r;uniform float t;uniform vec3 a,b,c,d;"+
   "float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}"+
   "float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}"+
   "float fb(vec2 p){float v=0.,m=.5;for(int i=0;i<4;i++){v+=m*n(p);p*=2.03;m*=.5;}return v;}"+
   "void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv*vec2(r.x/r.y,1.)*1.4;float s=t*.05;"+
   "vec2 q=vec2(fb(p+s),fb(p+vec2(5.2,1.3)-s));vec2 w=vec2(fb(p+2.*q+vec2(1.7,9.2)+s*1.4),fb(p+2.*q+vec2(8.3,2.8)-s));float f=fb(p+2.4*w);"+
   "vec3 col=mix(a,b,smoothstep(.15,.85,f));col=mix(col,c,smoothstep(.3,.95,length(q)*.9));col=mix(col,d,smoothstep(.5,1.,w.y)*.75);"+
   "col+=(h(gl_FragCoord.xy+fract(t))-.5)*.035;gl_FragColor=vec4(col,1.);}";
  function grad(cv){cv.style.background="linear-gradient(125deg,"+["--g1","--g2","--g3","--g4"].map(function(v){return cs.getPropertyValue(v);}).join(",")+")";}
  want.forEach(function(sel){
    var cv=document.querySelector(sel); if(!cv) return;
    var parent=cv.parentElement; if(sel!==".hero-gfx") parent.classList.add("on-grad");
    var gl=null; try{gl=cv.getContext("webgl",{antialias:false,premultipliedAlpha:false});}catch(e){}
    if(!gl){grad(cv);return;}
    function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
    var pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){grad(cv);return;}
    gl.useProgram(pr);
    var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    var loc=gl.getAttribLocation(pr,"p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    var uR=gl.getUniformLocation(pr,"r"), uT=gl.getUniformLocation(pr,"t");
    ["a","b","c","d"].forEach(function(k,i){gl.uniform3fv(gl.getUniformLocation(pr,k),C[i]);});
    var vis=true, seed=Math.random()*100;
    function size(){var s=0.5, w=Math.max(1,Math.round(cv.clientWidth*s)), h=Math.max(1,Math.round(cv.clientHeight*s)); if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h);}}
    function draw(ts){size(); gl.uniform2f(uR,cv.width,cv.height); gl.uniform1f(uT,seed+(ts||0)/1000); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
    function loop(ts){if(vis){draw(ts);} if(!REDUCED) requestAnimationFrame(loop);}
    if("IntersectionObserver" in window) new IntersectionObserver(function(e){vis=e[0].isIntersecting;}).observe(cv);
    window.addEventListener("resize",function(){draw(performance.now());});
    requestAnimationFrame(loop);
  });
})();

/* illustrated scenes (shown until a photograph loads) */
function rng(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280;};}
function ridge(r,base,amp,step,w,h){var p="M0,"+h+" L0,"+base, x=0; while(x<=w){var y=base-amp*(0.35+0.65*r()); p+=" L"+x.toFixed(0)+","+y.toFixed(0); x+=step*(0.6+0.8*r());} return p+" L"+w+","+base+" L"+w+","+h+" Z";}
var PAL={road:{sky:["#F6C9A0","#E9A27B"],sun:"#FBE7CF",r:["#B98A78","#8D6A66","#5E4D52","#3A3439"]},pass:{sky:["#BFD9E6","#E8E2D6"],sun:"#FFF7EA",r:["#D9E3E8","#A9B7BF","#7B8A90","#4E5A5E"],snow:1},river:{sky:["#F3DDBF","#E7C29C"],sun:"#FFF3E0",r:["#CBAE93","#A78769","#7E6550","#54453A"]},lakes:{sky:["#CFE5E5","#EEF2EC"],sun:"#FFFFFF",r:["#B6CBC7","#8AA39C","#5F7B72","#3D554E"],snow:1},lake:{sky:["#BFDCE0","#F0EBDD"],sun:"#FFFDF5",r:["#C7C1B2","#9C9584","#6E6A5C","#45443B"]},city:{sky:["#F2D7B6","#F6EBDD"],sun:"#FFF6E8",r:["#D6C6B0","#B9A68D"]},silk:{sky:["#F6D3AE","#EFC9A0"],sun:"#FFF1DF",r:["#D8B48E","#B98E66","#8E6A4C","#5E4634"]},village:{sky:["#E4D3BD","#F3E9DA"],sun:"#FFF8EC",r:["#C9B49A","#9D8670","#6F5D4E","#463B33"],snow:1}};
function scene(kind,wide){
  var W=wide?1600:800,H=wide?900:500,c=PAL[kind]||PAL.road,r=rng(kind.length*97+(wide?7:3)),id="g"+kind+(wide?"w":"")+Math.floor(Math.random()*1e6);
  var s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c.sky[0]+'"/><stop offset="1" stop-color="'+c.sky[1]+'"/></linearGradient></defs><rect width="'+W+'" height="'+H+'" fill="url(#'+id+')"/><circle cx="'+(W*0.72)+'" cy="'+(H*0.26)+'" r="'+(H*0.09)+'" fill="'+c.sun+'" opacity=".9"/>';
  for(var i=0;i<c.r.length;i++){var base=H*(0.42+i*0.13),amp=H*(0.26-i*0.045),step=W*(0.07+i*0.02); s+='<path d="'+ridge(r,base,amp,step,W,H)+'" fill="'+c.r[i]+'"/>'; if(c.snow&&i===0){s+='<path d="'+ridge(rng(11),base-amp*0.55,amp*0.35,step*0.8,W,base-amp*0.25)+'" fill="#FFFFFF" opacity=".55"/>';}}
  if(kind==="lake"||kind==="lakes"){s+='<ellipse cx="'+(W*0.48)+'" cy="'+(H*0.86)+'" rx="'+(W*0.42)+'" ry="'+(H*0.1)+'" fill="#3FA3A6"/>';}
  if(kind==="river"){s+='<path d="M0,'+(H*0.82)+' C'+(W*0.25)+','+(H*0.74)+' '+(W*0.45)+','+(H*0.9)+' '+(W*0.7)+','+(H*0.8)+' S'+(W*0.95)+','+(H*0.76)+' '+W+','+(H*0.79)+' L'+W+','+(H*0.86)+' C'+(W*0.8)+','+(H*0.9)+' '+(W*0.5)+','+(H*0.97)+' 0,'+(H*0.9)+' Z" fill="#7FB3B5" opacity=".9"/>';}
  if(kind==="road"||kind==="pass"){s+='<path d="M'+(W*0.35)+','+H+' C'+(W*0.45)+','+(H*0.86)+' '+(W*0.70)+','+(H*0.84)+' '+(W*0.58)+','+(H*0.74)+' S'+(W*0.48)+','+(H*0.66)+' '+(W*0.62)+','+(H*0.62)+'" fill="none" stroke="#E9DCC8" stroke-width="'+(H*0.03)+'" stroke-linecap="round" opacity=".85"/>';}
  return s+'</svg>';
}
document.querySelectorAll("[data-scene]").forEach(function(el){el.insertAdjacentHTML("afterbegin",scene(el.dataset.scene, el.dataset.wide==="1"));});
