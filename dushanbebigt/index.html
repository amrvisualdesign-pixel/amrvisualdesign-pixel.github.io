<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
img,svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:4px}
button{font:inherit;color:inherit}
.skip{position:absolute;left:-9999px}.skip:focus{left:14px;top:12px;z-index:99;background:#111;color:#fff;padding:10px 14px}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s cubic-bezier(.23,1,.32,1)}
.ph img.ok{opacity:1}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px}
.qa-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.23,1,.32,1)}
.qa-a>div{overflow:hidden}
button[aria-expanded="true"]+.qa-a{grid-template-rows:1fr}
.ready{display:none}.ready.show{display:block}
[data-field] .err{display:none}[data-field].bad .err{display:block}
.mbar{display:none}
@media (max-width:620px){.mbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:45;transform:translateY(150%);transition:transform .35s cubic-bezier(.23,1,.32,1)}.mbar.on{transform:none}.mbar>*{flex:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

:root{--navy:#0B1726;--navy-2:#13233A;--line:#24364F;--sig:#FFC93C;--txt:#E8EEF6;--mut:#93A3B8;--paper:#F4F6F9;--ink:#0B1726;--d:'Manrope',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;--e:cubic-bezier(.23,1,.32,1);--pad:28px}
body{background:var(--navy);color:var(--txt);font:400 17px/1.6 var(--d)}
::selection{background:var(--sig);color:var(--navy)}
:focus-visible{outline:3px solid var(--sig);outline-offset:3px}
.w{max-width:1200px;margin:0 auto;padding:0 var(--pad)}
header{position:sticky;top:0;z-index:40;background:var(--navy);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font:800 18px var(--d);text-decoration:none}
.logo b{display:grid;place-items:center;width:34px;height:34px;background:var(--sig);color:var(--navy);font:700 15px var(--m);border-radius:6px}
.r{display:flex;align-items:center;gap:6px}
.lang button{background:none;border:0;cursor:pointer;font:700 12px var(--m);padding:10px 8px;min-height:44px;color:var(--mut)}
.lang button[aria-pressed="true"]{color:var(--sig)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:8px;background:var(--sig);color:var(--navy);font:800 15px var(--d);text-decoration:none;border:0;cursor:pointer;transition:transform .16s var(--e),filter .2s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:none;color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
/* hero: departures board */
.hero{padding:clamp(56px,9vh,100px) 0 clamp(60px,9vh,100px)}
.hero h1{font:800 clamp(40px,6.4vw,92px)/.95 var(--d);letter-spacing:-.035em;max-width:13ch}
.hero h1 em{font-style:normal;color:var(--sig)}
.hero .sub{max-width:52ch;color:var(--mut);margin-top:20px;font-size:18px}
.hero .acts{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.board{margin-top:clamp(40px,7vh,70px);background:#060D17;border-radius:14px;padding:22px clamp(14px,2.4vw,30px);box-shadow:0 30px 60px -30px rgba(0,0,0,.6);overflow:hidden}
.bh,.brow{display:grid;grid-template-columns:110px 1fr 170px;gap:16px;align-items:center}
.bh{font:700 12px var(--m);color:var(--mut);letter-spacing:.12em;padding:0 0 12px;border-bottom:1px solid #1A2A40}
.brow{padding:14px 0;border-bottom:1px solid #12203a}
.brow:last-child{border-bottom:0}
.cells{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
.cell{display:inline-grid;place-items:center;width:1.25em;height:1.6em;background:#0F1B2D;border-radius:3px;font:700 clamp(15px,1.7vw,22px) var(--m);color:#F5F7FA;position:relative;flex:none}
.cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#060D17}
.cell.flip{animation:flip .09s linear}
@keyframes flip{0%{transform:scaleY(1)}50%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.code{font:700 15px var(--m);color:var(--sig)}
.stat{font:700 13px var(--m);letter-spacing:.06em;color:#6EE7A8;text-align:right}
.stat.b{color:var(--sig)}
/* two directions */
.dir{background:var(--paper);color:var(--ink);padding:clamp(90px,12vh,140px) 0}
.dir h2,.svc h2,.faq h2{font:800 clamp(34px,4.4vw,60px)/1 var(--d);letter-spacing:-.03em}
.switch{display:inline-flex;margin-top:30px;background:#E2E7EE;border-radius:999px;padding:5px;gap:4px}
.switch button{border:0;background:none;border-radius:999px;padding:12px 22px;min-height:46px;cursor:pointer;font:700 15px var(--d);color:#45556B;transition:background .25s var(--e),color .25s}
.switch button[aria-selected="true"]{background:var(--navy);color:#fff}
.dgrid{display:grid;grid-template-columns:5fr 7fr;gap:clamp(28px,5vw,70px);margin-top:44px;align-items:start}
.dgrid .ph{aspect-ratio:4/3;border-radius:14px}
.dgrid .ph .fb{font:800 28px var(--d);color:rgba(11,23,38,.2);background:#DCE3EC}
.dlist{list-style:none;border-top:2px solid var(--navy)}
.dlist li{display:grid;grid-template-columns:1fr auto;gap:16px;padding:20px 0;border-bottom:1px solid #D3DBE6}
.dlist b{font:800 22px var(--d);letter-spacing:-.01em}
.dlist span{display:block;color:#4A5A70;font-size:15.5px;margin-top:4px;max-width:46ch}
.dlist em{font:700 13px var(--m);font-style:normal;color:#2E6DB4;white-space:nowrap}
.swap{transition:opacity .22s var(--e),filter .22s var(--e)}
.swap.out{opacity:0;filter:blur(4px)}
/* services */
.svc{padding:clamp(90px,12vh,140px) 0}
.srow{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;padding:30px 0;border-top:1px solid var(--line);align-items:baseline}
.srow:last-child{border-bottom:1px solid var(--line)}
.srow h3{font:800 clamp(26px,3.2vw,44px)/1.05 var(--d);letter-spacing:-.02em}
.srow p{color:var(--mut);max-width:48ch}
.srow .tag{font:700 12px var(--m);color:var(--sig);letter-spacing:.12em;display:block;margin-bottom:8px}
/* questions */
.faq{background:var(--paper);color:var(--ink);padding:clamp(90px,12vh,140px) 0}
.fgrid{display:grid;grid-template-columns:4fr 7fr;gap:clamp(28px,5vw,70px)}
.fgrid .side p{margin-top:16px;color:#4A5A70}
.q{border-top:1px solid #C9D3E0}.q:last-child{border-bottom:1px solid #C9D3E0}
.q button{width:100%;display:flex;justify-content:space-between;gap:18px;align-items:center;background:none;border:0;text-align:left;padding:22px 0;min-height:44px;cursor:pointer;font:700 18px/1.35 var(--d);color:var(--ink)}
.q i{flex:none;font:700 14px var(--m);color:#2E6DB4}
.q i::before{content:"[+]"}
.q button[aria-expanded="true"] i::before{content:"[−]"}
.q p{padding:0 0 22px;color:#4A5A70;max-width:62ch}
/* boarding pass */
.pass{padding:clamp(90px,12vh,140px) 0}
.ticket{display:grid;grid-template-columns:2fr 1fr;background:var(--paper);color:var(--ink);border-radius:18px;overflow:hidden;position:relative}
.tmain{padding:clamp(24px,4vw,50px);border-right:2px dashed #C3CEDC}
.tside{padding:clamp(24px,4vw,50px);background:var(--sig);display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.ticket::before,.ticket::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:var(--navy);left:calc(66.66% - 15px)}
.ticket::before{top:-15px}.ticket::after{bottom:-15px}
.tmain h2{font:800 clamp(30px,3.8vw,52px)/1 var(--d);letter-spacing:-.03em}
.tmain .lead{color:#4A5A70;margin-top:12px}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
[data-field]{display:flex;flex-direction:column;gap:6px}
[data-field].full{grid-column:1/-1}
label{font:700 11.5px var(--m);letter-spacing:.12em;text-transform:uppercase;color:#5B6B80}
input,select,textarea{font:600 17px var(--d);border:0;border-bottom:2px solid #C3CEDC;background:none;padding:10px 0;min-height:48px;color:var(--ink);width:100%;border-radius:0}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:#2E6DB4}
textarea{min-height:70px;resize:vertical}
.err{color:#B3261E;font-size:13px;font-weight:700}
.fine{grid-column:1/-1;font-size:13px;color:#5B6B80}
.ready{grid-column:1/-1;font-weight:800}.ready a{color:#2E6DB4}
.tside .code-big{font:700 clamp(40px,5vw,64px)/1 var(--m);color:var(--navy)}
.tside small{font:700 12px var(--m);letter-spacing:.12em;color:rgba(11,23,38,.7)}
.tside .ch{display:flex;flex-direction:column;gap:6px;font-weight:800}
.tside .btn{background:var(--navy);color:#fff}
footer{border-top:1px solid var(--line);padding:26px 0 110px;color:var(--mut);font-size:13.5px}
footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (max-width:900px){.dgrid,.fgrid,.ticket,.srow{grid-template-columns:1fr}.tmain{border-right:0;border-bottom:2px dashed #C3CEDC}.ticket::before,.ticket::after{display:none}.bh,.brow{grid-template-columns:70px 1fr}.bh span:last-child,.brow .stat{display:none}}
@media (max-width:620px){:root{--pad:18px}form{grid-template-columns:1fr}.logo span{display:none}.hb .btn{padding:0 14px}.cell{width:1.05em;font-size:10.5px}.cells{gap:2px}.brow{gap:10px}.bh,.brow{grid-template-columns:44px 1fr}.code{font-size:12px}}
</style>
</head>

    <form id="form" novalidate>
      <div data-field><label for="n" data-t="l_n"></label><input id="n" data-m="m_n" autocomplete="name"><span class="err" data-t="e_n"></span></div>

</div></div></section>

/* shared plumbing: languages, photos, WhatsApp form, header state. The design lives in each page. */
document.documentElement.classList.add("js");
var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var lang = "en";
function setLang(l){
  lang = T[l] ? l : "en"; var d = T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function(el){var v=d[el.dataset.t]; if(v!=null) el.textContent=v;});
  document.querySelectorAll("[data-th]").forEach(function(el){var v=d[el.dataset.th]; if(v!=null) el.innerHTML=v;});
  document.querySelectorAll("[data-ph]").forEach(function(el){el.placeholder=d[el.dataset.ph]||"";});
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed", b.dataset.lang===lang?"true":"false");});
  document.querySelectorAll(".ph .fb").forEach(function(f){var s=f.parentElement.dataset.label; if(s&&d[s]) f.textContent=d[s];});
  if(window.onLang) onLang(d);
  document.title = d.title;
  try{localStorage.setItem(SLUG+"-lang",lang);}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang);});});

/* accordion helper for each page's own question markup */
function qa(box, items, cls){
  var open=[].map.call(box.querySelectorAll("button[aria-expanded]"),function(b){return b.getAttribute("aria-expanded")==="true";});
  box.innerHTML="";
  items.forEach(function(q,i){
    var id=box.id+"-a"+i, o=!!open[i];
    var wrap=document.createElement("div"); wrap.className=cls||"q";
    wrap.innerHTML='<button type="button" aria-expanded="'+o+'" aria-controls="'+id+'"><span class="qt"></span><i aria-hidden="true"></i></button><div class="qa-a" id="'+id+'"><div><p></p></div></div>';
    wrap.querySelector(".qt").textContent=q[0]; wrap.querySelector("p").textContent=q[1];
    wrap.querySelector("button").addEventListener("click",function(){this.setAttribute("aria-expanded",this.getAttribute("aria-expanded")==="true"?"false":"true");});
    box.appendChild(wrap);
  });
}

/* photographs from Wikimedia Commons; a named placeholder stays if none loads */
var used=[];
function credit(n){if(used.indexOf(n)>-1)return; used.push(n); var cl=document.getElementById("cl"); if(!cl)return; var a=document.createElement("a"); a.href="https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(n); a.target="_blank"; a.rel="noopener"; a.textContent=used.length; if(cl.childNodes.length)cl.appendChild(document.createTextNode(" ")); cl.appendChild(a); var c=document.getElementById("credits"); if(c)c.hidden=false;}
function loadPhoto(el, list){
  list = (list || el.dataset.photo || "").split("|").filter(Boolean);
  el.querySelectorAll("img,.fb").forEach(function(x){x.remove();});
  if(getComputedStyle(el).position==="static") el.style.position="relative";
  var fb=document.createElement("span"); fb.className="fb"; var s=el.dataset.label; if(s&&T[lang][s]) fb.textContent=T[lang][s]; el.appendChild(fb);
  var img=new Image(); img.alt=""; img.decoding="async"; if(!el.dataset.eager) img.loading="lazy";
  var w=el.dataset.w||1000;
  img.onload=function(){if(img.naturalWidth>50){img.classList.add("ok"); fb.remove(); credit(img.dataset.n);}};
  img.onerror=function(){var n=list.shift(); if(n){img.dataset.n=n; img.src="https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(n)+"?width="+w;} else img.remove();};
  el.appendChild(img); img.onerror();
}

/* WhatsApp form: every field with data-m becomes a line of the message */
function wireForm(){
  document.querySelectorAll("[data-wa]").forEach(function(a){a.href="https://wa.me/"+PHONE;});
  document.querySelectorAll("[data-tg]").forEach(function(a){a.href="https://t.me/"+TG;});
  var f=document.getElementById("form"); if(!f) return;
  f.addEventListener("submit",function(e){
    e.preventDefault(); var d=T[lang], n=document.getElementById("n"), box=n.closest("[data-field]");
    if(!n.value.trim()){box.classList.add("bad"); n.focus(); return;} box.classList.remove("bad");
    var lines=[d.hello];
    f.querySelectorAll("[data-m]").forEach(function(x){var v=x.tagName==="SELECT"?x.options[x.selectedIndex].textContent:x.value.trim(); if(v) lines.push((d[x.dataset.m]||"")+": "+v);});
    var a=document.getElementById("wa"); a.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(lines.join("\n"));
    document.getElementById("ready").classList.add("show"); a.focus();
  });
  document.querySelectorAll("[data-pick]").forEach(function(a){a.addEventListener("click",function(){var s=document.getElementById("r"); if(s) s.value=a.dataset.pick;});});
}

/* header turns solid after the first screen; the phone bar shows between hero and form */
function wireChrome(){
  var hd=document.querySelector("header"), hero=document.querySelector("[data-hero]"), mbar=document.querySelector(".mbar"), form=document.getElementById("form");
  var tick=false;
  function f(){tick=false; var hb=hero?hero.getBoundingClientRect().bottom:0;
    if(hd) hd.classList.toggle("solid", hb<80);
    if(mbar&&form){var r=form.getBoundingClientRect(); mbar.classList.toggle("on", hb<0 && !(r.top<innerHeight&&r.bottom>0));}
    if(window.onScroll) onScroll();}
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(f);}},{passive:true});
  addEventListener("resize",f); f();
}
function progress(el){var r=el.getBoundingClientRect(); return Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight)));}
function reveal(sel){var els=document.querySelectorAll(sel); if(RM||!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in");});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"}); els.forEach(function(e){io.observe(e);});}

function boot(){
  var l=null; try{l=localStorage.getItem(SLUG+"-lang");}catch(e){}
  if(!l){var n=(navigator.language||"en").toLowerCase(); l=n.indexOf("ru")===0?"ru":n.indexOf("tg")===0?"tg":"en";}
  setLang(l);
  document.querySelectorAll(".ph[data-photo]").forEach(function(el){loadPhoto(el);});
  wireForm(); wireChrome();
}

function boardRows(d){
  var box=document.getElementById("rows"); box.innerHTML="";
  d.rows.forEach(function(r,ri){
    var row=document.createElement("div"); row.className="brow";
    row.innerHTML='<span class="code">'+r[0]+'</span><div class="cells"></div><span class="stat'+(r[3]?' b':'')+'"></span>';
    row.querySelector(".stat").textContent=r[2];
    var cells=row.querySelector(".cells"), target=(r[1]+" ".repeat(W)).slice(0,W);
    for(var i=0;i<W;i++){var c=document.createElement("span"); c.className="cell"; c.textContent=RM?target[i]:" "; cells.appendChild(c);}
    box.appendChild(row);
    if(!RM) [].forEach.call(cells.children,function(c,i){var t=target[i], n=t===" "?0:4+((i+ri*3)%7), k=0;
      setTimeout(function step(){ if(k<n){c.textContent=ABC[Math.floor(Math.random()*ABC.length)]; c.classList.remove("flip"); void c.offsetWidth; c.classList.add("flip"); k++; setTimeout(step,70);} else c.textContent=t; }, 120*ri+i*28);});
  });
}
function showSide(s,anim){
  side=s; var d=T[lang], g=document.getElementById("dgrid");
  document.querySelectorAll(".switch button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.side===s?"true":"false");});

    var ph=document.getElementById("dph"); ph.dataset.label=s==="in"?"lbl_in":"lbl_out"; loadPhoto(ph,s==="in"?"Ak-Baital_Pass.jpg|From_Langar_to_Murghab_(30357439658).jpg":"Border_Pamir_highway_China.jpg|Vakhsh_River.jpg"); g.classList.remove("out");}
  if(anim&&!RM){g.classList.add("out"); setTimeout(fill,200);} else fill();
}
document.querySelectorAll(".switch button").forEach(function(b){b.addEventListener("click",function(){showSide(b.dataset.side,true);});});
var started=false;
function onLang(d){ boardRows(d); showSide(side,false); qa(document.getElementById("qs"), d.qs, "q"); }
boot();
